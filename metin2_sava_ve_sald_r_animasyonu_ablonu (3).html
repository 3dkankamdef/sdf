<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Metin2 Bedensel Savaşçı - Gerçekçi İnsan & Kılıç Animasyon Şablonu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #080b11;
            font-family: 'Inter', sans-serif;
            color: #e2e8f0;
            touch-action: none;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .font-rpg {
            font-family: 'Cinzel', serif;
        }
        .rpg-panel {
            background: linear-gradient(180deg, rgba(14, 19, 29, 0.92) 0%, rgba(7, 10, 16, 0.96) 100%);
            border: 1px solid rgba(212, 175, 55, 0.48);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.85), inset 0 0 18px rgba(212, 175, 55, 0.08);
            backdrop-filter: blur(12px);
        }
        .skill-btn {
            position: relative;
            transition: transform 0.12s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.15s, box-shadow 0.15s;
            border: 1.5px solid rgba(212, 175, 55, 0.68);
            background: radial-gradient(circle at 50% 30%, rgba(45, 58, 82, 0.95) 0%, rgba(10, 14, 22, 0.98) 100%);
            overflow: hidden;
            touch-action: manipulation;
        }
        .skill-btn:hover {
            border-color: #fbbf24;
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.55);
        }
        .skill-btn:active, .skill-btn.active-trigger {
            transform: scale(0.90);
            border-color: #ffffff;
            box-shadow: 0 0 28px rgba(251, 191, 36, 0.95);
        }
        .damage-popup {
            position: absolute;
            pointer-events: none;
            font-family: 'Cinzel', serif;
            font-weight: 900;
            text-shadow: 0 3px 8px rgba(0,0,0,0.98), 0 0 18px rgba(255, 110, 0, 0.95);
            animation: floatDamage 1.15s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            z-index: 40;
        }
        @keyframes floatDamage {
            0% { opacity: 1; transform: translate(-50%, 0) scale(0.45); }
            18% { opacity: 1; transform: translate(-50%, -34px) scale(1.32); }
            100% { opacity: 0; transform: translate(-50%, -96px) scale(0.92); }
        }
        #joystick-zone {
            position: fixed;
            bottom: 28px;
            left: 16px;
            width: 112px;
            height: 112px;
            border-radius: 9999px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.16) 0%, rgba(10, 14, 22, 0.88) 75%);
            border: 2px solid rgba(212, 175, 55, 0.55);
            box-shadow: 0 8px 28px rgba(0,0,0,0.75), inset 0 0 14px rgba(212, 175, 55, 0.18);
            z-index: 30;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #joystick-knob {
            width: 44px;
            height: 44px;
            border-radius: 9999px;
            background: radial-gradient(circle at 35% 35%, #fde047 0%, #d97706 65%, #78350f 100%);
            border: 2px solid rgba(255, 255, 255, 0.85);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.85), 0 0 14px rgba(245, 158, 11, 0.65);
            pointer-events: none;
            transform: translate(0px, 0px);
        }
        .attack-main-btn {
            background: radial-gradient(circle at 35% 30%, #f59e0b 0%, #b91c1c 62%, #450a0a 100%);
            border: 2.5px solid #fde047;
            box-shadow: 0 0 30px rgba(245, 158, 11, 0.6), inset 0 0 16px rgba(255, 255, 255, 0.35);
            transition: transform 0.08s ease, box-shadow 0.12s ease;
            touch-action: none;
        }
        .attack-main-btn:active, .attack-main-btn.active-trigger {
            transform: scale(0.90);
            border-color: #ffffff;
            box-shadow: 0 0 44px rgba(251, 191, 36, 0.98), inset 0 0 22px rgba(255, 255, 255, 0.75);
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); }
        ::-webkit-scrollbar-thumb { background: rgba(212, 175, 55, 0.5); border-radius: 4px; }
    </style>
</head>
<body class="relative select-none">

    <div id="canvas-container"></div>
    <div id="damage-layer" class="fixed inset-0 pointer-events-none z-30 overflow-hidden"></div>

    <header class="fixed top-2 left-2 right-2 z-20 flex flex-wrap items-center justify-between gap-1.5 pointer-events-none">
        <div class="rpg-panel rounded-xl px-2.5 py-1.5 flex items-center gap-2.5 pointer-events-auto">
            <div class="relative w-9 h-9 sm:w-11 sm:h-11 rounded-lg bg-gradient-to-br from-amber-500/30 via-red-950/60 to-slate-950 border border-amber-400/70 flex items-center justify-center shadow-inner">
                <svg class="w-5 h-5 sm:w-6 sm:h-6 text-amber-400 drop-shadow" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3zm0 2.18l6 2.25v4.66c0 4.13-2.88 8.03-6 9.08-3.12-1.05-6-4.95-6-9.08V6.43l6-2.25z"/>
                </svg>
                <span id="char-level-badge" class="absolute -bottom-1 -right-1 bg-amber-500 text-slate-950 text-[8px] font-black px-1 rounded border border-amber-200">Lv.1</span>
            </div>
            <div>
                <div class="flex items-center gap-1.5">
                    <h1 class="font-rpg text-[11px] sm:text-sm font-bold text-amber-300 tracking-wider">BEDENSEL SAVAŞÇI</h1>
                    <span id="aura-badge" class="hidden text-[8px] px-1.5 py-0.5 rounded-full bg-orange-500/30 border border-amber-400/80 text-amber-200 font-bold animate-pulse">HAVA KILICI M1</span>
                </div>
                <div class="w-28 sm:w-44 space-y-1 mt-1">
                    <div class="h-1.5 w-full bg-slate-950 rounded-full overflow-hidden border border-red-900/70">
                        <div class="h-full bg-gradient-to-r from-red-800 via-red-500 to-rose-400 w-full"></div>
                    </div>
                    <div class="h-1 w-full bg-slate-950 rounded-full overflow-hidden border border-blue-900/70">
                        <div class="h-full bg-gradient-to-r from-blue-800 via-blue-500 to-cyan-400 w-11/12"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="rpg-panel rounded-xl p-1 flex items-center gap-1 pointer-events-auto">
            <button onclick="setCameraView('default')" class="px-2 py-1 rounded-lg text-[10px] sm:text-[11px] font-medium bg-slate-900/90 hover:bg-amber-500/20 hover:text-amber-300 border border-slate-700/70 transition">Aksiyon</button>
            <button onclick="setCameraView('closeup')" class="px-2 py-1 rounded-lg text-[10px] sm:text-[11px] font-medium bg-slate-900/90 hover:bg-amber-500/20 hover:text-amber-300 border border-slate-700/70 transition">Yüz & Zırh</button>
            <button onclick="setCameraView('hand')" class="px-2 py-1 rounded-lg text-[10px] sm:text-[11px] font-medium bg-slate-900/90 hover:bg-amber-500/20 hover:text-amber-300 border border-slate-700/70 transition">El & Silah</button>
            <button id="sound-btn" onclick="toggleAudio()" class="px-2 py-1 rounded-lg text-[10px] sm:text-[11px] font-medium bg-slate-900/90 text-amber-300 border border-slate-700/70 transition" title="Ses Efektleri">🔊</button>
            <button id="toggle-panel-btn" onclick="toggleInspector()" class="px-2 py-1 rounded-lg text-[10px] sm:text-[11px] font-semibold bg-amber-500/20 text-amber-300 border border-amber-500/50 hover:bg-amber-500/30 transition flex items-center gap-1">
                <span>⚙️ Ekipman</span>
            </button>
            <select id="export-kind-select" aria-label="Dışa aktarılacak varlık" class="max-w-28 sm:max-w-40 bg-slate-950/95 border border-emerald-400/50 rounded-lg px-1.5 py-1 text-[10px] sm:text-[11px] text-emerald-100 focus:outline-none focus:border-emerald-300">
                <option value="character">Karakter + animasyon</option>
                <option value="armor">Zırh seti</option>
                <option value="sword">Kılıç</option>
            </select>
            <button id="header-export-btn" onclick="exportWarriorGLB(this)" class="px-2 py-1 rounded-lg text-[10px] sm:text-[11px] font-semibold bg-emerald-500/20 text-emerald-200 border border-emerald-400/50 hover:bg-emerald-500/30 transition flex items-center gap-1" title="Seçili varlığı GLB olarak indir">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v12m0 0 4-4m-4 4-4-4M5 17v3h14v-3"/></svg>
                <span>GLB İndir</span>
            </button>
            <a id="prepared-glb-download" class="hidden px-2 py-1 rounded-lg text-[10px] sm:text-[11px] font-bold bg-emerald-500 text-slate-950 border border-emerald-300 hover:bg-emerald-400 transition" role="button">Hazır GLB'yi indir</a>
            <span id="header-export-status" class="hidden fixed top-14 right-2 z-50 max-w-[calc(100vw-1rem)] rounded-lg border border-emerald-400/50 bg-slate-950/95 px-3 py-2 text-[11px] font-semibold text-emerald-100 shadow-xl" role="status" aria-live="polite"></span>
        </div>
    </header>

    <div class="fixed top-16 left-0 right-0 z-20 flex justify-center pointer-events-none">
        <div id="combo-indicator" class="opacity-0 transition-all duration-200 rpg-panel px-4 py-1 rounded-full text-[11px] sm:text-xs font-rpg font-bold tracking-widest text-amber-300 border border-amber-400/80 shadow-lg">
            KOMBO VURUŞU #1
        </div>
    </div>

    <aside id="inspector-panel" class="hidden fixed top-16 right-2.5 z-40 w-72 sm:w-80 rpg-panel rounded-xl p-3.5 transition-all duration-300 pointer-events-auto max-h-[calc(100vh-180px)] overflow-y-auto">
        <div class="flex items-center justify-between border-b border-amber-500/25 pb-2 mb-3">
            <h2 class="font-rpg text-xs font-bold text-amber-300 tracking-wider uppercase">Seviye & Ekipman Gelişimi</h2>
            <button onclick="toggleInspector()" class="text-slate-400 hover:text-white text-xs px-1.5">✕</button>
        </div>

        <div class="space-y-3 text-xs">
            <div>
                <label class="block text-amber-300/90 font-semibold mb-1.5">Hızlı Seviye Seti Seçimi</label>
                <div class="grid grid-cols-2 gap-1.5">
                    <button onclick="applyEquipmentPreset('lv1')" class="px-2 py-1.5 rounded-lg bg-slate-900 hover:bg-amber-500/20 border border-amber-500/40 text-amber-200 font-semibold text-[11px] transition">Lv.1 Başlangıç (+0)</button>
                    <button onclick="applyEquipmentPreset('lv30')" class="px-2 py-1.5 rounded-lg bg-slate-900 hover:bg-amber-500/20 border border-slate-700 text-slate-200 font-semibold text-[11px] transition">Lv.30 Dolunay (+6)</button>
                    <button onclick="applyEquipmentPreset('lv70')" class="px-2 py-1.5 rounded-lg bg-slate-900 hover:bg-amber-500/20 border border-slate-700 text-slate-200 font-semibold text-[11px] transition">Lv.70 Siyah Çelik (+9)</button>
                    <button onclick="applyEquipmentPreset('lv105')" class="px-2 py-1.5 rounded-lg bg-slate-900 hover:bg-amber-500/20 border border-slate-700 text-slate-200 font-semibold text-[11px] transition">Lv.105 Mavi Çelik (+9)</button>
                </div>
            </div>

            <div>
                <label class="block text-slate-300 font-medium mb-1">Silah Seçimi (Lv.1 - Lv.105)</label>
                <select id="sword-select" onchange="changeSwordType(this.value)" class="w-full bg-slate-950 border border-amber-500/40 rounded-lg px-2.5 py-1.5 text-slate-100 focus:outline-none focus:border-amber-400">
                    <option value="longsword" selected>Lv.1 Uzun Kılıç +0 (Başlangıç Demir Kılıç)</option>
                    <option value="broadsword">Lv.20 Geniş Kılıç +6 (Gümüş İşlemeli Pala)</option>
                    <option value="greatsword">Lv.30 Dolunay Kılıcı +9 (Hilal Kesitli Efsane)</option>
                    <option value="poison">Lv.75 Zehir Kılıcı +9 (Karanlık Kor & Kan Oluğu)</option>
                    <option value="triton">Lv.90 Triton / Sirius Kılıcı +9 (Mavi Aura)</option>
                </select>
            </div>

            <div>
                <label class="block text-slate-300 font-medium mb-1">Zırh Seti (Lv.1 - Lv.105)</label>
                <select id="armor-select" onchange="changeArmorTheme(this.value)" class="w-full bg-slate-950 border border-amber-500/40 rounded-lg px-2.5 py-1.5 text-slate-100 focus:outline-none focus:border-amber-400">
                    <option value="monk" selected>Lv.1 Keşiş Plaka Zırh +0 (Deri Tunik & Demir Plaka)</option>
                    <option value="tiger">Lv.18 Kaplan Plaka Zırh +6 (Bronz & Kaplan İşleme)</option>
                    <option value="dragonred">Lv.42 Ejderha Plaka Zırh +8 (Kızıl Çelik & Altın)</option>
                    <option value="blacksteel">Lv.70 Siyah Çelik Zırh +9 (Antrasit Çelik & +9 Parlama)</option>
                    <option value="bluesteel">Lv.105 Mavi Çelik Zırh +9 (Gümüş & Mavi Aura)</option>
                </select>
            </div>

            <div>
                <label class="block text-slate-300 font-medium mb-1">Başlık / Miğfer Tipi</label>
                <select id="helmet-select" onchange="changeHelmetMode(this.value)" class="w-full bg-slate-950 border border-amber-500/40 rounded-lg px-2.5 py-1.5 text-slate-100 focus:outline-none focus:border-amber-400">
                    <option value="none" selected>Lv.1 Başlıksız (Gerçekçi Savaşçı Yüzü & Saçı)</option>
                    <option value="band">Lv.1 Geleneksel Demir Alınlık +0 (Yüz Görünür)</option>
                    <option value="crown">Lv.41 Boynuzlu Savaşçı Miğferi +9 (Yüz Görünür)</option>
                    <option value="full">Lv.80 Kapalı Şövalye Vizörü (Tam Miğfer)</option>
                </select>
            </div>

            <div>
                <label class="block text-slate-300 font-medium mb-1">Düz Zemin Şablonu</label>
                <select id="ground-select" onchange="changeGroundStyle(this.value)" class="w-full bg-slate-950 border border-amber-500/40 rounded-lg px-2.5 py-1.5 text-slate-100 focus:outline-none focus:border-amber-400">
                    <option value="stone">Köy Meydanı (Arnavut Taş Zemin)</option>
                    <option value="sand">Çöl / Ardream Toprak Zemin</option>
                    <option value="grid">Geliştirici Grid Şablonu (Mat Siyah/Altın)</option>
                </select>
            </div>

            <div class="pt-1.5 space-y-2 border-t border-slate-800/80">
                <div class="flex items-center justify-between">
                    <span class="text-slate-300">Saldırı & Animasyon Hızı</span>
                    <span id="speed-val" class="text-amber-300 font-mono">1.00x</span>
                </div>
                <input id="anim-speed" type="range" min="0.7" max="1.4" step="0.05" value="1.00" oninput="updateAnimSpeed(this.value)" class="w-full accent-amber-400 cursor-pointer h-1.5 bg-slate-800 rounded-lg">

                <div class="flex items-center justify-between pt-1">
                    <span class="text-slate-300">Klan Pelerini</span>
                    <input type="checkbox" id="cape-toggle" onchange="toggleCape(this.checked)" class="w-4 h-4 accent-amber-500 rounded cursor-pointer">
                </div>

                <div class="flex items-center justify-between">
                    <span class="text-slate-300">Karanlık Metin Taşı (Hedef)</span>
                    <input type="checkbox" id="metin-toggle" checked onchange="toggleMetinStone(this.checked)" class="w-4 h-4 accent-amber-500 rounded cursor-pointer">
                </div>
            </div>
            <div class="pt-2 border-t border-slate-800/80">
                <button id="export-character-btn" onclick="exportWarriorGLB(this)" class="w-full px-3 py-2 rounded-lg bg-amber-500/20 hover:bg-amber-500/30 border border-amber-400/60 text-amber-200 font-semibold text-[11px] transition">Karakteri ve animasyonları GLB indir</button>
                <p id="export-status" class="mt-1.5 min-h-4 text-[10px] text-slate-400" role="status" aria-live="polite"></p>
            </div>
        </div>
    </aside>

    <!-- Left Virtual Analog Joystick -->
    <div id="joystick-zone" title="Yürümek ve Koşmak için Sürükleyin">
        <div class="absolute inset-2 rounded-full border border-amber-400/20 pointer-events-none"></div>
        <div class="absolute text-[8px] font-rpg text-amber-300/60 top-1.5 pointer-events-none">KOŞ</div>
        <div class="absolute text-[8px] font-rpg text-amber-300/60 bottom-1.5 pointer-events-none">GERİ</div>
        <div id="joystick-knob"></div>
    </div>

    <!-- Mobile-Safe Right Combat Cluster (Positioned safely away from bottom-right browser floating icons) -->
    <div class="fixed bottom-6 right-20 sm:bottom-8 sm:right-16 z-30 w-44 h-44 sm:w-52 sm:h-52 pointer-events-none select-none">
        <!-- Skill 1: Hava Kılıcı -->
        <button id="btn-skill-1" onpointerdown="triggerSkill('aura', event)" class="skill-btn pointer-events-auto absolute bottom-0 right-24 sm:right-28 w-11 h-11 sm:w-14 sm:h-14 rounded-full flex flex-col items-center justify-center shadow-xl">
            <span class="absolute -top-1 -right-1 bg-slate-950 border border-amber-400 text-[9px] font-bold text-amber-300 w-4 h-4 rounded-full flex items-center justify-center">1</span>
            <svg class="w-4 h-4 sm:w-5 sm:h-5 text-orange-400 drop-shadow" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 23a7.5 7.5 0 0 1-5.138-12.963C8.204 8.774 11.5 6.5 11 1.5c6 4 9 8 3 14 1 0 2.5 0 5-2.47.27.773.5 1.604.5 2.47A7.5 7.5 0 0 1 12 23z"/>
            </svg>
            <span class="text-[7px] sm:text-[8px] text-amber-100 font-bold leading-none mt-0.5">Hava K.</span>
        </button>

        <!-- Skill 2: Kılıç Çevirme -->
        <button id="btn-skill-2" onpointerdown="triggerSkill('spin', event)" class="skill-btn pointer-events-auto absolute bottom-12 right-24 sm:bottom-16 sm:right-28 w-11 h-11 sm:w-14 sm:h-14 rounded-full flex flex-col items-center justify-center shadow-xl">
            <span class="absolute -top-1 -right-1 bg-slate-950 border border-amber-400 text-[9px] font-bold text-amber-300 w-4 h-4 rounded-full flex items-center justify-center">2</span>
            <svg class="w-4 h-4 sm:w-5 sm:h-5 text-cyan-400 drop-shadow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
            </svg>
            <span class="text-[7px] sm:text-[8px] text-amber-100 font-bold leading-none mt-0.5">Çevirme</span>
        </button>

        <!-- Skill 3: Üç Yönlü Kesme -->
        <button id="btn-skill-3" onpointerdown="triggerSkill('triple', event)" class="skill-btn pointer-events-auto absolute bottom-24 right-16 sm:bottom-28 sm:right-20 w-11 h-11 sm:w-14 sm:h-14 rounded-full flex flex-col items-center justify-center shadow-xl">
            <span class="absolute -top-1 -right-1 bg-slate-950 border border-amber-400 text-[9px] font-bold text-amber-300 w-4 h-4 rounded-full flex items-center justify-center">3</span>
            <svg class="w-4 h-4 sm:w-5 sm:h-5 text-amber-400 drop-shadow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
            </svg>
            <span class="text-[7px] sm:text-[8px] text-amber-100 font-bold leading-none mt-0.5">3 Yönlü</span>
        </button>

        <!-- Skill 4: Hamle -->
        <button id="btn-skill-4" onpointerdown="triggerSkill('dash', event)" class="skill-btn pointer-events-auto absolute bottom-24 right-1 sm:bottom-28 sm:right-2 w-11 h-11 sm:w-14 sm:h-14 rounded-full flex flex-col items-center justify-center shadow-xl">
            <span class="absolute -top-1 -right-1 bg-slate-950 border border-amber-400 text-[9px] font-bold text-amber-300 w-4 h-4 rounded-full flex items-center justify-center">4</span>
            <svg class="w-4 h-4 sm:w-5 sm:h-5 text-purple-400 drop-shadow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13 5l7 7-7 7M5 5l7 7-7 7"/>
            </svg>
            <span class="text-[7px] sm:text-[8px] text-amber-100 font-bold leading-none mt-0.5">Hamle</span>
        </button>

        <!-- GIANT PRIMARY ATTACK BUTTON -->
        <button id="btn-combo"
                onpointerdown="startAttackHold(event)"
                onpointerup="stopAttackHold(event)"
                onpointercancel="stopAttackHold(event)"
                onpointerleave="stopAttackHold(event)"
                class="attack-main-btn pointer-events-auto absolute bottom-0 right-0 w-20 h-20 sm:w-24 sm:h-24 rounded-full flex flex-col items-center justify-center select-none">
            <svg class="w-8 h-8 sm:w-10 sm:h-10 text-amber-100 drop-shadow-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M14.5 17.5L3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2"/>
            </svg>
            <span class="font-rpg text-[11px] sm:text-xs font-black text-white tracking-wider drop-shadow mt-0.5">SALDIR</span>
            <span class="text-[7px] sm:text-[8px] text-amber-200 font-semibold leading-none">Basılı Tut</span>
        </button>
    </div>

    <script>

        function ensureAudio() {
            if (!state.audioEnabled) return null;
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) audioCtx = new AudioContextClass();
            }
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playCombatSound(type) {
            const ctx = ensureAudio();
            if (!ctx) return;
            const now = ctx.currentTime;

            if (type === 'swing' || type === 'heavyswing') {
                const dur = type === 'heavyswing' ? 0.30 : 0.22;
                const bufferSize = Math.floor(ctx.sampleRate * dur);
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    const env = Math.pow(Math.sin((i / bufferSize) * Math.PI), 1.4);
                    data[i] = (Math.random() * 2 - 1) * env;
                }
                const noise = ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = new BiquadFilterNode(ctx, {
                    type: 'bandpass',
                    frequency: type === 'heavyswing' ? 340 : 520,
                    Q: 2.1
                });
                filter.frequency.exponentialRampToValueAtTime(type === 'heavyswing' ? 95 : 145, now + dur * 0.92);

                const gain = ctx.createGain();
                gain.gain.setValueAtTime(type === 'heavyswing' ? 0.44 : 0.30, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + dur);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(ctx.destination);
                noise.start(now);

                // Subtle metallic blade air-whistle harmonic
                const bladeOsc = ctx.createOscillator();
                const bladeGain = ctx.createGain();
                bladeOsc.type = 'sine';
                bladeOsc.frequency.setValueAtTime(type === 'heavyswing' ? 580 : 720, now);
                bladeOsc.frequency.exponentialRampToValueAtTime(190, now + dur * 0.85);
                bladeGain.gain.setValueAtTime(0.055, now);
                bladeGain.gain.exponentialRampToValueAtTime(0.001, now + dur * 0.85);
                bladeOsc.connect(bladeGain);
                bladeGain.connect(ctx.destination);
                bladeOsc.start(now);
                bladeOsc.stop(now + dur * 0.86);
            } else if (type === 'step') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(95, now);
                osc.frequency.exponentialRampToValueAtTime(28, now + 0.09);
                gain.gain.setValueAtTime(0.16, now);
                gain.gain.exponentialRampToValueAtTime(0.005, now + 0.095);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.10);
            } else if (type === 'hit') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(138, now);
                osc.frequency.exponentialRampToValueAtTime(26, now + 0.32);
                gain.gain.setValueAtTime(0.75, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.33);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.33);

                const clang = ctx.createOscillator();
                const cGain = ctx.createGain();
                clang.type = 'sawtooth';
                clang.frequency.setValueAtTime(860 + Math.random() * 260, now);
                clang.frequency.exponentialRampToValueAtTime(210, now + 0.19);
                cGain.gain.setValueAtTime(0.26, now);
                cGain.gain.exponentialRampToValueAtTime(0.005, now + 0.20);
                clang.connect(cGain);
                cGain.connect(ctx.destination);
                clang.start(now);
                clang.stop(now + 0.20);
            } else if (type === 'skill') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(240, now);
                osc.frequency.exponentialRampToValueAtTime(42, now + 0.52);
                gain.gain.setValueAtTime(0.42, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.54);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now);
                osc.stop(now + 0.54);
            }
        }

            setTimeout(() => el.remove(), 1150);

        function buildChainmailTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#141821';
            ctx.fillRect(0, 0, 256, 256);

            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 2.5;
            const step = 16;
            for (let y = 0; y <= 256; y += step / 2) {
                const offset = (y / (step / 2)) % 2 === 0 ? 0 : step / 2;
                for (let x = -step; x <= 256 + step; x += step) {
                    ctx.beginPath();
                    ctx.arc(x + offset, y, 6, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(4, 4);
            return tex;
        }

        function buildGroundTexture(style) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            if (style === 'grid') {
                ctx.fillStyle = '#0c1017';
                ctx.fillRect(0, 0, 1024, 1024);
                ctx.strokeStyle = 'rgba(212, 175, 55, 0.28)';
                ctx.lineWidth = 2;
                for (let i = 0; i <= 1024; i += 64) {
                    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 1024); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(1024, i); ctx.stroke();
                }
            } else if (style === 'sand') {
                ctx.fillStyle = '#473828';
                ctx.fillRect(0, 0, 1024, 1024);
                for (let i = 0; i < 24000; i++) {
                    const x = Math.random() * 1024, y = Math.random() * 1024;
                    const v = 50 + Math.random() * 45;
                    ctx.fillStyle = `rgba(${v + 26}, ${v + 14}, ${v - 6}, 0.28)`;
                    ctx.fillRect(x, y, 4, 4);
                }
            } else {
                ctx.fillStyle = '#292522';
                ctx.fillRect(0, 0, 1024, 1024);
                const rows = 10, cols = 10;
                const w = 1024 / cols, h = 1024 / rows;
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        const ox = (r % 2 === 0) ? 0 : w * 0.5;
                        const x = (c * w + ox) % 1024;
                        const y = r * h;
                        const tone = 46 + Math.floor(Math.random() * 20);
                        ctx.fillStyle = `rgb(${tone + 10}, ${tone + 4}, ${tone - 4})`;
                        ctx.beginPath();
                        ctx.roundRect(x + 4, y + 4, w - 8, h - 8, 10);
                        ctx.fill();
                        ctx.strokeStyle = 'rgba(15, 12, 10, 0.55)';
                        ctx.lineWidth = 3;
                        ctx.stroke();
                    }
                }
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(16, 16);
            tex.anisotropy = 8;
            return tex;
        }

        function buildRealisticFaceTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            // 1. Base Realistic Warm Human Skin Tone with Subtle Anatomical Gradients
            const baseGrad = ctx.createLinearGradient(0, 0, 0, 1024);

            baseGrad.addColorStop(0.48, '#d39066'); // Midface / Cheekbones

                ctx.fillRect(px, py, 2, 2);

            // 2. Cheekbone Warmth & Temple/Jawline Sculpting Shadows

                cheekGrad.addColorStop(1, 'rgba(195, 95, 70, 0)');
                ctx.fillStyle = cheekGrad;

                const hollowGrad = ctx.createRadialGradient(512 + side * 240, 680, 15, 512 + side * 240, 680, 140);
                hollowGrad.addColorStop(0, 'rgba(75, 38, 22, 0.24)');
                hollowGrad.addColorStop(1, 'rgba(75, 38, 22, 0)');
                ctx.fillStyle = hollowGrad;
                ctx.fillRect(0, 0, 1024, 1024);

            // 3. Realistic Masculine 5-O'Clock Stubble / Short Groomed Warrior Beard Shading (Soft & Natural, NO black triangle!)

            beardGrad.addColorStop(0.0, 'rgba(38, 26, 20, 0.42)');
            beardGrad.addColorStop(0.55, 'rgba(42, 28, 22, 0.28)');
            beardGrad.addColorStop(0.82, 'rgba(42, 28, 22, 0.08)');
            beardGrad.addColorStop(1.0, 'rgba(42, 28, 22, 0)');
            ctx.fillStyle = beardGrad;
            ctx.beginPath();
            ctx.ellipse(512, 745, 290, 220, 0, 0, Math.PI * 2);
            ctx.fill();

            // Fine individual hair follicles in the beard/mustache zone
            ctx.strokeStyle = 'rgba(28, 18, 14, 0.32)';
            ctx.lineWidth = 1.6;

                const angle = Math.random() * Math.PI * 2;
                const radX = Math.random() * 255;
                const radY = Math.random() * 175;
                const bx = 512 + Math.cos(angle) * radX;
                const by = 745 + Math.sin(angle) * radY;
                // Keep skin clear on cheeks/eyes and right on the lips
                if (by > 615 && !(Math.abs(bx - 512) < 88 && by > 662 && by < 728)) {
                    ctx.beginPath();
                    ctx.moveTo(bx, by);
                    ctx.lineTo(bx + (bx - 512) * 0.015, by + 5);
                    ctx.stroke();
                }
            }

            // Subtle Mustache Shadow above upper lip
            const stacheGrad = ctx.createRadialGradient(512, 652, 8, 512, 658, 118);
            stacheGrad.addColorStop(0, 'rgba(32, 20, 15, 0.48)');
            stacheGrad.addColorStop(0.7, 'rgba(32, 20, 15, 0.22)');
            stacheGrad.addColorStop(1, 'rgba(32, 20, 15, 0)');
            ctx.fillStyle = stacheGrad;
            ctx.beginPath();
            ctx.ellipse(512, 654, 112, 30, 0, 0, Math.PI * 2);
            ctx.fill();

            // 4. Nose Bridge Shading, Highlight & Nostrils
            [-1, 1].forEach(side => {
                const nShadow = ctx.createLinearGradient(512, 420, 512 + side * 68, 420);
                nShadow.addColorStop(0, 'rgba(110, 55, 32, 0)');
                nShadow.addColorStop(0.65, 'rgba(105, 52, 30, 0.25)');

                ctx.fillStyle = nShadow;

                // Subtle nostril shadow

                scleraGrad.addColorStop(0.7, '#e2e8f0');

                irisGrad.addColorStop(0.35, '#6b3410');
                irisGrad.addColorStop(0.78, '#451a03');
                irisGrad.addColorStop(1, '#0f0704');
                ctx.fillStyle = irisGrad;
                ctx.beginPath();
                ctx.arc(irisX, irisY, 24, 0, Math.PI * 2);
                ctx.fill();

                // Pupil
                ctx.fillStyle = '#050505';
                ctx.beginPath();
                ctx.arc(irisX, irisY, 9.5, 0, Math.PI * 2);
                ctx.fill();

                // Corneal Specular Catchlight (brings the human eye to life!)

                ctx.beginPath();
                ctx.arc(irisX - 6, irisY - 6, 4.2, 0, Math.PI * 2);

                ctx.beginPath();
                ctx.moveTo(ex - side * 66, ey - 30);
                ctx.quadraticCurveTo(ex - side * 15, ey - 58, ex + side * 54, ey - 48);
                ctx.lineTo(ex + side * 64, ey - 28);
                ctx.quadraticCurveTo(ex - side * 10, ey - 38, ex - side * 66, ey - 16);
                ctx.closePath();
                ctx.fill();
            });

            // Subtle Veteran Warrior Cheek Scar on Left Side
            ctx.strokeStyle = 'rgba(165, 82, 62, 0.48)';
            ctx.lineWidth = 3.2;
            ctx.beginPath();
            ctx.moveTo(648, 475);
            ctx.lineTo(632, 575);
            ctx.stroke();

            const tex = new THREE.CanvasTexture(canvas);
            tex.anisotropy = 8;
            return tex;
        }

        function buildArmorCuirassTexture(theme) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            if (theme === 'monk') {
                // Lv.1 KEŞİŞ PLAKA ZIRH +0 (Authentic Metin2 Level 1 Starter Armor: Quilted Brown Leather Tunic + Forged Iron Chest Plate & Straps)
                const leatherGrad = ctx.createLinearGradient(0, 0, 0, 1024);
                leatherGrad.addColorStop(0, '#4a2c18');
                leatherGrad.addColorStop(0.5, '#3b2212');
                leatherGrad.addColorStop(1, '#26150a');
                ctx.fillStyle = leatherGrad;
                ctx.fillRect(0, 0, 1024, 1024);

                // Quilted gambeson diamond stitching
                ctx.strokeStyle = 'rgba(20, 10, 5, 0.45)';
                ctx.lineWidth = 3;
                for (let i = -1024; i < 2048; i += 48) {
                    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i + 1024, 1024); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(i + 1024, 0); ctx.lineTo(i, 1024); ctx.stroke();
                }

                // Upper Forged Iron Plackart / Chest Plate
                const ironGrad = ctx.createLinearGradient(200, 120, 824, 620);
                ironGrad.addColorStop(0, '#525b66');
                ironGrad.addColorStop(0.5, '#768291');
                ironGrad.addColorStop(1, '#39404a');
                ctx.fillStyle = ironGrad;
                ctx.beginPath();
                ctx.moveTo(180, 140);
                ctx.lineTo(844, 140);
                ctx.lineTo(790, 560);
                ctx.lineTo(512, 660);
                ctx.lineTo(234, 560);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = '#94a3b8';
                ctx.lineWidth = 8;
                ctx.stroke();

                // Pectoral contour shading on the iron chest plate
                ctx.strokeStyle = 'rgba(25, 30, 38, 0.65)';
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.moveTo(250, 390);
                ctx.quadraticCurveTo(380, 445, 500, 395);
                ctx.moveTo(774, 390);
                ctx.quadraticCurveTo(644, 445, 524, 395);
                ctx.stroke();

                // Diagonal brown leather shoulder/chest harness strap
                ctx.strokeStyle = '#5c3419';
                ctx.lineWidth = 44;
                ctx.beginPath();
                ctx.moveTo(210, 120);
                ctx.lineTo(780, 680);
                ctx.stroke();
                ctx.strokeStyle = '#a16207';
                ctx.lineWidth = 4;
                ctx.stroke();
            } else {
                // High-tier forged plate armors (Tiger Lv.18, Dragon Lv.42, Black Steel Lv.70, Blue Steel Lv.105)
                let baseDark = '#1a202c', baseMid = '#2d3748', accentCol = '#3b1319', trimCol = '#fbbf24';
                if (theme === 'tiger') {
                    baseDark = '#3d2616'; baseMid = '#6b4226'; accentCol = '#92400e'; trimCol = '#f59e0b';
                } else if (theme === 'dragonred') {
                    baseDark = '#3b0d14'; baseMid = '#691924'; accentCol = '#991b1b'; trimCol = '#fbbf24';
                } else if (theme === 'bluesteel') {
                    baseDark = '#0f223d'; baseMid = '#1e3a5f'; accentCol = '#0284c7'; trimCol = '#e2e8f0';
                }

                const bgGrad = ctx.createLinearGradient(0, 0, 1024, 1024);
                bgGrad.addColorStop(0, baseDark);
                bgGrad.addColorStop(0.5, baseMid);
                bgGrad.addColorStop(1, baseDark);
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, 1024, 1024);

                // Sculpted V-Taper Pectoral & Abdominal Rib Reliefs painted into texture
                ctx.fillStyle = accentCol;
                ctx.strokeStyle = trimCol;
                ctx.lineWidth = 10;

                // Left & Right Pectoral Plates
                [-1, 1].forEach(side => {
                    ctx.beginPath();
                    ctx.moveTo(512 + side * 24, 190);
                    ctx.lineTo(512 + side * 310, 210);
                    ctx.lineTo(512 + side * 270, 440);
                    ctx.lineTo(512 + side * 24, 490);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();

                    // Abdominal Rib Segments
                    for (let r = 0; r < 3; r++) {
                        const y0 = 520 + r * 95;
                        ctx.beginPath();
                        ctx.moveTo(512 + side * 24, y0);
                        ctx.lineTo(512 + side * (240 - r * 28), y0 - 20);
                        ctx.lineTo(512 + side * (220 - r * 28), y0 + 55);
                        ctx.lineTo(512 + side * 24, y0 + 75);
                        ctx.closePath();
                        ctx.fill();
                        ctx.stroke();
                    }
                });

                // Center Sternum Gold Spine
                ctx.fillStyle = trimCol;
                ctx.fillRect(496, 150, 32, 720);
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.anisotropy = 8;
            return tex;
        }

        function createProceduralTextures() {
            // 1. Procedural Equirectangular Environment Map for realistic metal reflections
            const envCanvas = document.createElement('canvas');
            envCanvas.width = 512;
            envCanvas.height = 256;
            const eCtx = envCanvas.getContext('2d');
            const envGrad = eCtx.createLinearGradient(0, 0, 0, 256);
            envGrad.addColorStop(0.0, '#1e293b');
            envGrad.addColorStop(0.45, '#475569');
            envGrad.addColorStop(0.50, '#0f172a');
            envGrad.addColorStop(1.0, '#020617');
            eCtx.fillStyle = envGrad;
            eCtx.fillRect(0, 0, 512, 256);

            eCtx.fillStyle = 'rgba(255, 240, 200, 0.35)';
            eCtx.beginPath();
            eCtx.arc(140, 64, 42, 0, Math.PI * 2);
            eCtx.fill();

            const envMap = new THREE.CanvasTexture(envCanvas);
            envMap.mapping = THREE.EquirectangularReflectionMapping;

            // 2. Soft Volumetric Fire Aura Sprite Texture
            const fireCanvas = document.createElement('canvas');
            fireCanvas.width = 128;
            fireCanvas.height = 128;
            const fCtx = fireCanvas.getContext('2d');
            const fGrad = fCtx.createRadialGradient(64, 64, 4, 64, 64, 60);
            fGrad.addColorStop(0.0, 'rgba(255, 255, 240, 1)');
            fGrad.addColorStop(0.35, 'rgba(255, 160, 40, 0.85)');
            fGrad.addColorStop(0.70, 'rgba(220, 38, 38, 0.35)');
            fGrad.addColorStop(1.0, 'rgba(0, 0, 0, 0)');
            fCtx.fillStyle = fGrad;
            fCtx.fillRect(0, 0, 128, 128);
            const fireSpriteTexture = new THREE.CanvasTexture(fireCanvas);

            // 3. Ancient Metin2 Ground Rune Circle Texture (Hava Kılıcı)
            const runeCanvas = document.createElement('canvas');
            runeCanvas.width = 512;
            runeCanvas.height = 512;
            const rCtx = runeCanvas.getContext('2d');
            rCtx.strokeStyle = '#ffffff';
            rCtx.lineWidth = 8;
            rCtx.beginPath();
            rCtx.arc(256, 256, 220, 0, Math.PI * 2);
            rCtx.stroke();

            rCtx.lineWidth = 4;
            rCtx.beginPath();
            rCtx.arc(256, 256, 185, 0, Math.PI * 2);
            rCtx.stroke();

            for (let i = 0; i < 8; i++) {
                const a = (i / 8) * Math.PI * 2;
                const a2 = ((i + 3) / 8) * Math.PI * 2;
                rCtx.beginPath();
                rCtx.moveTo(256 + Math.cos(a) * 185, 256 + Math.sin(a) * 185);
                rCtx.lineTo(256 + Math.cos(a2) * 185, 256 + Math.sin(a2) * 185);
                rCtx.stroke();
            }
            const runeTexture = new THREE.CanvasTexture(runeCanvas);

            const pCanvas = document.createElement('canvas');
            pCanvas.width = 64;
            pCanvas.height = 64;
            const pCtx = pCanvas.getContext('2d');
            const grad = pCtx.createRadialGradient(32, 32, 1, 32, 32, 28);
            grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
            grad.addColorStop(0.25, 'rgba(255, 235, 150, 0.95)');
            grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            pCtx.fillStyle = grad;
            pCtx.fillRect(0, 0, 64, 64);
            pCtx.fillStyle = '#ffffff';
            pCtx.fillRect(30, 4, 4, 56);
            pCtx.fillRect(4, 30, 56, 4);
            const sparkTexture = new THREE.CanvasTexture(pCanvas);

            return {
                envMap,
                fireSpriteTexture,
                runeTexture,
                sparkTexture,
                chainmailTex: buildChainmailTexture(),
                capeTexture: buildCapeTexture(),
                groundTexture: buildGroundTexture('stone'),
                faceTexture: buildRealisticFaceTexture(),
                cuirassTexture: buildArmorCuirassTexture('monk')
            };
        }

        function loadGLTFAsset(loader, url) {
            return new Promise((resolve, reject) => loader.load(url, resolve, undefined, reject));
        }

        async function loadUploadedGameAssets() {
            const loader = new THREE.GLTFLoader();
            const files = [
                'metin2_karakter_rig_animasyon.glb',
                'metin2_zirh_monk.glb',
                'metin2_kilic_longsword.glb'
            ];

            try {
                const [characterAsset, armorAsset, swordAsset] = await Promise.all(
                    files.map((file) => loadGLTFAsset(loader, file))
                );
                const characterRoot = characterAsset.scene;
                const characterGroups = new Map();
                characterRoot.traverse((node) => {
                    if (node.isGroup && node.name) characterGroups.set(node.name, node);
                });

                uploadedArmorMeshes = [];
                const missingArmorGroups = [];
                armorAsset.scene.traverse((node) => {
                    if (!node.isMesh) return;
                    const targetGroup = characterGroups.get(node.parent && node.parent.name);
                    if (!targetGroup) {
                        missingArmorGroups.push(node.parent && node.parent.name || node.name);
                        return;
                    }

                    const armorMesh = node.clone();
                    armorMesh.castShadow = true;
                    armorMesh.receiveShadow = true;
                    targetGroup.add(armorMesh);
                    uploadedArmorMeshes.push(armorMesh);
                });
                if (missingArmorGroups.length || uploadedArmorMeshes.length === 0) {
                    throw new Error('Zırh eklem eşleşmesi tamamlanamadı: ' + missingArmorGroups.slice(0, 4).join(', '));
                }

                const weaponMount = characterRoot.getObjectByName('Savasci_weaponMount');
                const swordRoot = swordAsset.scene.children[0];
                if (!weaponMount || !swordRoot) throw new Error('Karakterde Savasci_weaponMount veya kılıç GLB kökü bulunamadı.');
                weaponMount.add(swordAsset.scene);
                uploadedSwordRoot = swordAsset.scene;

                uploadedCharacterRoot = characterRoot;
                uploadedCharacterMixer = new THREE.AnimationMixer(characterRoot);
                uploadedAnimationActions = new Map();
                characterAsset.animations.forEach((clip) => uploadedAnimationActions.set(clip.name, clip));
                warriorGroup.add(characterRoot);

                const capeToggle = document.getElementById('cape-toggle');
                if (capeToggle) capeToggle.addEventListener('change', refreshUploadedAssetVisibility);
                refreshUploadedAssetVisibility();

                const status = document.getElementById('header-export-status');
                status.textContent = 'GitHub GLB karakteri, Keşiş zırhı ve Uzun Kılıç oyuna yüklendi.';
                status.classList.remove('hidden');
                setTimeout(() => status.classList.add('hidden'), 4500);
            } catch (error) {
                console.error('Uploaded GLB integration failed; using procedural character:', error);
                const status = document.getElementById('header-export-status');
                status.textContent = 'GLB modelleri yüklenemedi; prosedürel karakter kullanılıyor: ' + error.message;
                status.classList.remove('hidden');
            }
        }

        function refreshUploadedAssetVisibility() {
            if (!uploadedCharacterRoot) return;
            const capeToggle = document.getElementById('cape-toggle');
            const canUseUploadedSet = state.armorTheme === 'monk'
                && state.swordType === 'longsword'
                && state.helmetMode === 'none'
                && !(capeToggle && capeToggle.checked);

            uploadedRigActive = canUseUploadedSet;
            uploadedCharacterRoot.visible = canUseUploadedSet;
            if (joints.root) joints.root.visible = !canUseUploadedSet;
            uploadedArmorMeshes.forEach((mesh) => { mesh.visible = canUseUploadedSet; });
            if (uploadedSwordRoot) uploadedSwordRoot.visible = canUseUploadedSet;
            if (!canUseUploadedSet && uploadedCurrentAction) {
                uploadedCurrentAction.stop();
                uploadedCurrentAction = null;
                uploadedCurrentClip = '';
            }
        }

        function updateUploadedCharacterAnimation(dt) {
            if (!uploadedRigActive || !uploadedCharacterMixer) return;

            const actionClips = {
                slash1: 'Slash_1',
                slash2: 'Slash_2',
                slash3: 'Slash_3',
                slash4: 'Slash_4',
                auraCast: 'Skill_Aura',
                spin: 'Skill_Spin',
                triple: 'Skill_Triple',
                dash: 'Skill_Dash'
            };
            const clipName = state.actionState === 'idle'
                ? (state.currentSpeed > 0.12 ? 'Walk_Run' : 'Idle')
                : (actionClips[state.actionState] || 'Idle');

            if (clipName !== uploadedCurrentClip) {
                const clip = uploadedAnimationActions.get(clipName);
                if (!clip) return;
                const nextAction = uploadedCharacterMixer.clipAction(clip);
                const isLooping = clipName === 'Idle' || clipName === 'Walk_Run';
                nextAction.reset();
                nextAction.enabled = true;
                nextAction.clampWhenFinished = !isLooping;
                nextAction.setLoop(isLooping ? THREE.LoopRepeat : THREE.LoopOnce, isLooping ? Infinity : 1);
                if (uploadedCurrentAction) uploadedCurrentAction.fadeOut(0.10);
                nextAction.fadeIn(0.10).play();
                uploadedCurrentAction = nextAction;
                uploadedCurrentClip = clipName;
            }

            uploadedCharacterMixer.update(dt);
        }

        function createSculptedTorsoGeometry() {
            const radSegs = 36;
            const heightSegs = 24;
            const geo = new THREE.CylinderGeometry(1, 1, 0.66, radSegs, heightSegs, false);
            geo.translate(0, 0.33, 0);

            const pos = geo.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                const vx = pos.getX(i);
                const vy = pos.getY(i);
                const vz = pos.getZ(i);
                const t = THREE.MathUtils.clamp(vy / 0.66, 0, 1);
                const angle = Math.atan2(vx, vz);
                const distFromAxis = Math.hypot(vx, vz);
                if (distFromAxis < 0.001) continue;

                let widthX, depthZ;
                if (t < 0.78) {
                    const k = t / 0.78;
                    widthX = 0.162 + 0.115 * Math.pow(k, 0.85);
                    depthZ = 0.128 + 0.052 * Math.sin(k * Math.PI * 0.80);
                } else {
                    const k = (t - 0.78) / 0.22;
                    const smoothK = k * k * (3 - 2 * k);
                    widthX = THREE.MathUtils.lerp(0.277, 0.095, smoothK);
                    depthZ = THREE.MathUtils.lerp(0.158, 0.092, smoothK);
                }

                const nx = Math.sin(angle);
                const nz = Math.cos(angle);
                let x = nx * widthX;
                let z = nz * depthZ;

                if (nz > 0.2 && t > 0.42 && t < 0.82) {
                    const pecHeight = Math.sin(((t - 0.42) / 0.40) * Math.PI);
                    z += Math.max(0, nz - 0.2) * pecHeight * 0.036;
                }

                pos.setXYZ(i, x, vy, z);
            }
            geo.computeVertexNormals();
            return geo;
        }

                    const trim = new THREE.Mesh(new THREE.BoxGeometry(0.029, 0.014, 0.236 - i * 0.024), materials.goldTrim);
                    trim.position.set(0, -i * 0.072 - 0.038, 0);

            torsoMesh.receiveShadow = true;

            // Armored Collar / Gorget (Positioned cleanly at the base of the neck)
            const collarGold = new THREE.Mesh(new THREE.TorusGeometry(0.116, 0.013, 10, 28), materials.goldTrim);
            collarGold.rotation.x = Math.PI / 2;
            collarGold.position.set(0, 0.635, 0.005);
            joints.chest.add(collarGold);

            createArticulatedCape(joints.chest);
            if (joints.capeRoot) joints.capeRoot.visible = false; // Hidden at Lv.1 start; enabled on higher sets or checkbox

            createReal3DHumanHeadAndNeck(joints.chest);

            // Build Arms with Exposed Muscular Biceps, Symmetrical Pauldrons, and 5-Finger Articulated Hands!
            createArmHierarchy('R', -1);
            createArmHierarchy('L', 1);

            createLegHierarchy('R', -1);
            createLegHierarchy('L', 1);

            swordGroup = new THREE.Group();
            swordGroup.name = 'Savasci_Kilic';
            joints.weaponMount.add(swordGroup);
            buildSwordGeometry(state.swordType);
            changeHelmetMode(state.helmetMode);

            warriorGroup.name = 'Savasci';
            Object.entries(joints).forEach(([jointName, joint]) => {
                if (joint && joint.isObject3D) joint.name = 'Savasci_' + jointName;
            });
            joints.root.name = 'Savasci_Rig';
            let nodeIndex = 0;
            joints.root.traverse((node) => {

            });
