        function snapshotObjectTransforms(root) {
            const snapshots = new Map();
            root.traverse((node) => {
                snapshots.set(node, {
                    position: node.position.clone(),
                    quaternion: node.quaternion.clone(),
                    scale: node.scale.clone()
                });
            });
            return snapshots;
        }

        function restoreObjectTransforms(snapshots) {
            snapshots.forEach((transform, node) => {
                node.position.copy(transform.position);
                node.quaternion.copy(transform.quaternion);
                node.scale.copy(transform.scale);
            });
        }

        function captureTransformValues(nodes) {
            const values = new Map();
            nodes.forEach((node) => {
                values.set(node, { positions: [], quaternions: [], scales: [] });
            });
            return values;
        }

        function recordTransformValues(nodes, values) {
            nodes.forEach((node) => {
                const tracks = values.get(node);
                tracks.positions.push(node.position.x, node.position.y, node.position.z);
                tracks.quaternions.push(node.quaternion.x, node.quaternion.y, node.quaternion.z, node.quaternion.w);
                tracks.scales.push(node.scale.x, node.scale.y, node.scale.z);
            });
        }

        function hasAnimatedValues(values, itemSize) {
            for (let i = itemSize; i < values.length; i++) {
                if (Math.abs(values[i] - values[i % itemSize]) > 0.00001) return true;
            }
            return false;
        }

        function makeBakedAnimationClip(name, duration, actionState, walking, nodes) {
            warriorGroup.position.set(0, 0, 0);
            warriorGroup.rotation.set(0, 0, 0);
            state.actionState = 'idle';
            state.actionTime = 0;
            state.lastActionProgress = 0;
            state.hitMilestones = {};
            state.queuedNextCombo = false;
            state.isHoldingAttack = false;
            state.hitStopTimer = 0;
            state.hitVibration = 0;
            state.currentSpeed = 0;
            state.walkCyclePhase = 0;
            state.moveKeys = { w: false, a: false, s: false, d: false };
            state.joyVec.set(0, 0);
            updateWarriorAnimation(1, 0);
            state.walkCyclePhase = 0;

            state.actionState = actionState;
            state.actionDuration = duration;
            state.actionTime = 0;
            state.lastActionProgress = 0;
            state.currentSpeed = walking ? 1 : 0;
            state.joyVec.y = walking ? 1 : 0;

            const frameRate = 30;
            const frameCount = Math.ceil(duration * frameRate);
            const times = [0];
            const values = captureTransformValues(nodes);
            recordTransformValues(nodes, values);
            let elapsed = 0;

            for (let frame = 1; frame <= frameCount; frame++) {
                const sampleTime = Math.min(duration, frame / frameRate);
                const delta = sampleTime - elapsed;
                updateWarriorAnimation(delta, sampleTime);
                if (actionState === 'idle') warriorGroup.position.set(0, 0, 0);
                elapsed = sampleTime;
                times.push(sampleTime);
                recordTransformValues(nodes, values);
            }

            const tracks = [];
            values.forEach((transform, node) => {
                if (hasAnimatedValues(transform.positions, 3)) {
                    tracks.push(new THREE.VectorKeyframeTrack(node.name + '.position', times, transform.positions));
                }
                if (hasAnimatedValues(transform.quaternions, 4)) {
                    tracks.push(new THREE.QuaternionKeyframeTrack(node.name + '.quaternion', times, transform.quaternions));
                }
                if (hasAnimatedValues(transform.scales, 3)) {
                    tracks.push(new THREE.VectorKeyframeTrack(node.name + '.scale', times, transform.scales));
                }
            });
            return new THREE.AnimationClip(name, duration, tracks);
        }

        async function createWarriorAnimationClips(onProgress) {
            const nodes = [];
            warriorGroup.traverse((node) => {
                if (!node.isGroup) return;
                let ancestor = node;
                while (ancestor && ancestor !== warriorGroup.parent) {
                    if (!ancestor.visible) return;
                    if (ancestor === warriorGroup) break;
                    ancestor = ancestor.parent;
                }
                nodes.push(node);
            });

            const idleDuration = Math.PI * 2 / 1.2;
            const walkDuration = Math.PI * 2 / 10.4;
            const attackClips = [
                ['Slash_1', 'slash1', 0.76],
                ['Slash_2', 'slash2', 0.74],
                ['Slash_3', 'slash3', 0.88],
                ['Slash_4', 'slash4', 1.08],
                ['Skill_Aura', 'auraCast', 1.48],
                ['Skill_Spin', 'spin', 1.62],
                ['Skill_Triple', 'triple', 1.72],
                ['Skill_Dash', 'dash', 1.12]
            ];
            const clipDefinitions = [
                ['Idle', idleDuration, 'idle', false],
                ['Walk_Run', walkDuration, 'idle', true],
                ...attackClips.map(([name, actionState, duration]) => [name, duration, actionState, false])
            ];
            const clips = [];
            for (let index = 0; index < clipDefinitions.length; index++) {
                const [name, duration, actionState, walking] = clipDefinitions[index];
                if (onProgress) onProgress(name, index + 1, clipDefinitions.length);
                await new Promise((resolve) => setTimeout(resolve, 0));
                clips.push(makeBakedAnimationClip(name, duration, actionState, walking, nodes));
            }
            return clips;
        }

        function validateAnimationClips(root, clips) {
            const expectedNames = [
                'Idle', 'Walk_Run', 'Slash_1', 'Slash_2', 'Slash_3', 'Slash_4',
                'Skill_Aura', 'Skill_Spin', 'Skill_Triple', 'Skill_Dash'
            ];
            const actualNames = new Set(clips.map((clip) => clip.name));
            const missingNames = expectedNames.filter((name) => !actualNames.has(name));
            if (missingNames.length) throw new Error('Missing animation clips: ' + missingNames.join(', '));

            clips.forEach((clip) => {
                if (clip.tracks.length === 0) throw new Error('Animation has no tracks: ' + clip.name);
                clip.tracks.forEach((track) => {
                    const binding = THREE.PropertyBinding.parseTrackName(track.name);
                    if (!THREE.PropertyBinding.findNode(root, binding.nodeName)) {
                        throw new Error('Animation target not found: ' + track.name);
                    }
                });
            });
        }

        function showGLBDownloadLink(blob, fileName, status, message) {
            const link = document.getElementById('prepared-glb-download');
            if (link.dataset.objectUrl) URL.revokeObjectURL(link.dataset.objectUrl);
            const url = URL.createObjectURL(blob);
            link.href = url;
            link.download = fileName;
            link.title = fileName;
            link.dataset.objectUrl = url;
            link.classList.remove('hidden');
            status.textContent = message;
            link.onclick = () => setTimeout(() => {
                if (link.dataset.objectUrl === url) {
                    URL.revokeObjectURL(url);
                    delete link.dataset.objectUrl;
                    link.classList.add('hidden');
                }
            }, 60000);
        }

        function createWarriorExportAsset(assetType) {
            if (assetType === 'sword') {
                const swordAsset = swordGroup.clone(true);
                swordAsset.name = 'Metin2_Kilic_' + state.swordType;
                swordAsset.position.set(0, 0, 0);
                swordAsset.rotation.set(0, 0, 0);
                swordAsset.scale.set(1, 1, 1);
                swordAsset.userData = { equipmentType: 'weapon', equipmentSlot: 'weapon_r', attachTo: 'Savasci_weaponMount' };
                return swordAsset;
            }

            const assetRoot = warriorGroup.clone(true);
            assetRoot.position.set(0, 0, 0);
            assetRoot.rotation.set(0, 0, 0);
            assetRoot.scale.set(1, 1, 1);
            const targetRing = assetRoot.getObjectByName('Savasci_TargetRing');
            if (targetRing) targetRing.parent.remove(targetRing);
            const sword = assetRoot.getObjectByName('Savasci_Kilic');
            if (sword) sword.parent.remove(sword);

            const armorMaterials = new Set([
                materials.cuirassBody,
                materials.armorSteel,
                materials.armorAccentPlate,
                materials.goldTrim,
                materials.leather,
                materials.cape,
                materials.chainmail,
                materials.hornBone
            ]);

            assetRoot.traverse((node) => {
                if (!node.isMesh) return;
                const nodeMaterials = Array.isArray(node.material) ? node.material : [node.material];
                const isArmor = nodeMaterials.some((material) => armorMaterials.has(material));
                const isBodyUnderlay = node.name === 'Savasci_Torso_Base'
                    || node.name === 'Savasci_Pelvis_Base'
                    || node.name.includes('_Base_')
                    || nodeMaterials.includes(materials.chainmail);

                if (assetType === 'armor') {
                    node.visible = isArmor;
                } else if (isBodyUnderlay) {
                    node.material = materials.humanSkin.clone();
                } else if (isArmor) {
                    node.visible = false;
                }
            });

            if (assetType === 'armor') {
                assetRoot.name = 'Metin2_Zirh_' + state.armorTheme;
                assetRoot.userData = { equipmentType: 'armor', equipmentSlot: 'body', skeletonRoot: 'Savasci_Rig', armorTheme: state.armorTheme };
                return assetRoot;
            }

            const characterRoot = new THREE.Group();
            characterRoot.name = 'Metin2_Karakter_Root';
            characterRoot.userData = { equipmentType: 'character', skeletonRoot: 'Savasci_Rig', animationClips: 10 };
            characterRoot.add(assetRoot);
            return characterRoot;
        }

        async function exportWarriorGLB(clickedButton) {
            const button = clickedButton || document.getElementById('export-character-btn');
            const status = document.getElementById(button.id === 'header-export-btn' ? 'header-export-status' : 'export-status');
            if (!joints.root || !THREE.GLTFExporter) {
                status.textContent = 'GLB dışa aktarıcı yüklenemedi.';
                status.classList.remove('hidden');
                return;
            }

            status.classList.remove('hidden');
            const assetType = document.getElementById('export-kind-select').value;
            button.disabled = true;
            const statusText = {
                character: 'Karakter ve animasyon klipleri hazırlanıyor...',
                armor: 'Seçili zırh seti hazırlanıyor...',
                sword: 'Seçili kılıç hazırlanıyor...'
            };
            status.textContent = statusText[assetType];
            let exportTimeout;
            let exportFinished = false;
            const savedState = {
                ...state,
                moveKeys: { ...state.moveKeys },
                joyVec: state.joyVec.clone(),
                hitMilestones: { ...state.hitMilestones }
            };
            const transformSnapshots = snapshotObjectTransforms(warriorGroup);
            const savedCameraTheta = camState.theta;
            let animations;

            animations = [];
            if (assetType === 'character') {
                isSamplingAnimations = true;
                try {
                    state.animSpeed = 1;
                    state.metinActive = false;
                    camState.theta = 0;
                    animations = await createWarriorAnimationClips((name, index, total) => {
                        status.textContent = 'Animasyonlar hazırlanıyor ' + index + '/' + total + ': ' + name;
                    });
                } catch (error) {
                    console.error('Animation sampling failed:', error);
                    button.disabled = false;
                    status.textContent = 'Animasyon export hatası: ' + error.message;
                    return;
                } finally {
                    isSamplingAnimations = false;
                    Object.assign(state, savedState);
                    camState.theta = savedCameraTheta;
                    restoreObjectTransforms(transformSnapshots);
                }
            }

            try {
                warriorGroup.updateMatrixWorld(true);
                const exportRoot = createWarriorExportAsset(assetType);
                const unsupportedNodes = [];
                exportRoot.traverse((node) => {
                    if (node.isSprite || node.isLight || node.isPoints) unsupportedNodes.push(node);
                });
                unsupportedNodes.forEach((node) => node.parent && node.parent.remove(node));

                if (animations.length) validateAnimationClips(exportRoot, animations);
                const exporter = new THREE.GLTFExporter();
                exportTimeout = setTimeout(() => {
                    exportFinished = true;
                    button.disabled = false;
                    status.textContent = 'GLB dışa aktarımı zaman aşımına uğradı. Tekrar deneyin.';
                }, 60000);
                exporter.parse(exportRoot, async (result) => {
                    if (exportFinished) return;
                    exportFinished = true;
                    clearTimeout(exportTimeout);
                    try {
                        if (!(result instanceof ArrayBuffer) || new DataView(result).getUint32(0, true) !== 0x46546c67) {
                            throw new Error('Exporter did not return a binary GLB.');
                        }
                        const blob = new Blob([result], { type: 'model/gltf-binary' });
                        const fileName = assetType === 'character'
                            ? 'metin2_karakter_rig_animasyon.glb'
                            : assetType === 'armor'
                                ? 'metin2_zirh_' + state.armorTheme + '.glb'
                                : 'metin2_kilic_' + state.swordType + '.glb';
                        if (assetType === 'character') {
                            showGLBDownloadLink(blob, fileName, status, 'Animasyonlu GLB hazır. Yeşil indirme bağlantısına tıkla.');
                        } else {
                            showGLBDownloadLink(
                                blob,
                                fileName,
                                status,
                                assetType === 'armor'
                                    ? 'Zırh GLB hazır. Yeşil indirme bağlantısına tıkla.'
                                    : 'Kılıç GLB hazır. Yeşil indirme bağlantısına tıkla.'
                            );
                        }
                    } catch (error) {
                        console.error('GLB result validation failed:', error);
                        status.textContent = 'GLB sonucu doğrulanamadı (' + error.name + '): ' + error.message;
                    } finally {
                        button.disabled = false;
                    }
                }, { binary: true, onlyVisible: true, animations });
            } catch (error) {
                if (exportTimeout) clearTimeout(exportTimeout);
                exportFinished = true;
                console.error('GLB export failed:', error);
                button.disabled = false;
                status.textContent = 'GLB oluşturulamadı (' + error.name + '): ' + error.message;
            }
        }

        function createSculptedHumanHeadGeometry() {
            // High-resolution 64x64 sphere sculpted into a realistic masculine human head & face (Zero separate floating boxes!)
            const headGeo = new THREE.SphereGeometry(0.110, 64, 64);
            const pos = headGeo.attributes.position;
            const uv = headGeo.attributes.uv;

            for (let i = 0; i < pos.count; i++) {
                let x = pos.getX(i);
                let y = pos.getY(i);
                let z = pos.getZ(i);

                // Normalize coordinates (-1 to +1)
                const nx = x / 0.110;
                const ny = y / 0.110;
                const nz = z / 0.110;

                // 1. Masculine Cranium & Jaw Proportions
                y *= 1.22;
                x *= 0.88;
                z *= 1.02;

                // Taper lower face into a strong masculine jawline & chin
                if (ny < 0.05) {
                    const jawT = THREE.MathUtils.clamp((0.05 - ny) / 1.05, 0, 1);
                    // Narrow temples into jaw and chin
                    const widthFactor = 1.0 - Math.pow(jawT, 1.35) * 0.34;
                    x *= widthFactor;

                    if (nz > 0) {
                        // Project chin and jawline forward
                        const chinCurve = Math.sin(jawT * Math.PI * 0.85);
                        z += chinCurve * 0.014;
                    }
                }

                // 2. Sculpt 3D Anatomical Facial Reliefs on Front Hemisphere (nz > 0.15)
                if (nz > 0.15) {
                    const frontWeight = THREE.MathUtils.smoothstep(nz, 0.15, 0.55);

                    // A. Supraorbital Brow Ridge (ny around +0.20)
                    const browDistY = Math.abs(ny - 0.21);
                    if (browDistY < 0.16 && Math.abs(nx) < 0.62) {
                        const browArch = Math.cos((browDistY / 0.16) * Math.PI * 0.5);
                        const browWidth = Math.cos((Math.abs(nx) / 0.62) * Math.PI * 0.5);
                        z += browArch * browWidth * 0.011 * frontWeight;
                    }

                    // B. Recessed Eye Sockets (ny around +0.07, |nx| around 0.30)
                    const eyeDistX = Math.abs(Math.abs(nx) - 0.30);
                    const eyeDistY = Math.abs(ny - 0.07);
                    const eyeRadius = Math.hypot(eyeDistX / 0.22, eyeDistY / 0.14);
                    if (eyeRadius < 1.0) {
                        const socketDepth = Math.cos(eyeRadius * Math.PI * 0.5);
                        z -= socketDepth * 0.008 * frontWeight;
                    }

                    // C. Prominent 3D Human Nose Bridge & Tip (nx near 0, ny from -0.25 to +0.18)
                    if (ny > -0.28 && ny < 0.20 && Math.abs(nx) < 0.26) {
                        const noseWidth = Math.cos((Math.abs(nx) / 0.26) * Math.PI * 0.5);
                        // Nose projects furthest at the tip (ny = -0.18)
                        const noseProfile = THREE.MathUtils.smoothstep(ny, 0.20, -0.16) * THREE.MathUtils.smoothstep(ny, -0.28, -0.18);
                        const bridgeProfile = THREE.MathUtils.smoothstep(ny, 0.22, 0.05) * THREE.MathUtils.smoothstep(ny, -0.25, -0.05);
                        z += (noseProfile * 0.024 + bridgeProfile * 0.014) * Math.pow(noseWidth, 1.4) * frontWeight;
                    }

                    // D. Zygomatic Cheekbones (|nx| around 0.45, ny around -0.08)
                    const cheekDist = Math.hypot((Math.abs(nx) - 0.42) / 0.28, (ny + 0.08) / 0.22);
                    if (cheekDist < 1.0) {
                        const cheekLift = Math.cos(cheekDist * Math.PI * 0.5);
                        z += cheekLift * 0.007 * frontWeight;
                        x += Math.sign(nx) * cheekLift * 0.004 * frontWeight;
                    }

                    // E. Subtle 3D Lip Mounds & Chin Prominence
                    if (ny > -0.52 && ny < -0.30 && Math.abs(nx) < 0.28) {
                        const lipW = Math.cos((Math.abs(nx) / 0.28) * Math.PI * 0.5);
                        const lipH = Math.sin(((ny + 0.52) / 0.22) * Math.PI);
                        z += lipW * lipH * 0.008 * frontWeight;
                    }
                    if (ny <= -0.55 && ny > -0.88 && Math.abs(nx) < 0.30) {
                        const chinW = Math.cos((Math.abs(nx) / 0.30) * Math.PI * 0.5);
                        const chinH = Math.sin(((ny + 0.88) / 0.33) * Math.PI);
                        z += chinW * chinH * 0.009 * frontWeight;
                    }
                }

                // Shift head center so pivot is at the base of the skull (y = 0.105 is eye level)
                const finalY = y + 0.108;
                pos.setXYZ(i, x, finalY, z);

                // 3. Exact Frontal Planar UV Projection for the 1024x1024 Realistic Face Texture!
                if (nz > 0.05) {
                    const u = THREE.MathUtils.clamp(0.5 + (x / 0.098) * 0.38, 0.02, 0.98);
                    // Map finalY (from ~0.23 forehead to ~-0.02 chin) onto v (0.85 down to 0.15)
                    const v = THREE.MathUtils.clamp(0.54 + ((finalY - 0.108) / 0.132) * 0.36, 0.02, 0.98);
                    uv.setXY(i, u, v);
                } else {
                    // Back/sides of head sample pure skin tone area at top corner of face texture
                    uv.setXY(i, 0.10, 0.92);
                }
            }

            headGeo.computeVertexNormals();
            return headGeo;
        }

        function createReal3DHumanHeadAndNeck(parentChest) {
            joints.neck = new THREE.Group();
            joints.neck.position.set(0, 0.63, 0.008);
            parentChest.add(joints.neck);

            // Smooth Anatomical Muscular Human Neck (Single sculpted mesh without protruding white pipes!)
            const neckGeo = new THREE.CylinderGeometry(0.064, 0.080, 0.125, 28, 6);
            const nPos = neckGeo.attributes.position;
            for (let i = 0; i < nPos.count; i++) {
                let x = nPos.getX(i), y = nPos.getY(i), z = nPos.getZ(i);
                // Slight natural trapezius flare at the bottom sides
                if (y < 0) {
                    x *= 1.0 + (-y / 0.062) * 0.12;
                }
                nPos.setXYZ(i, x, y, z);
            }
            neckGeo.computeVertexNormals();
            const neckMesh = new THREE.Mesh(neckGeo, materials.humanSkin);
            neckMesh.position.y = 0.052;
            neckMesh.castShadow = true;
            joints.neck.add(neckMesh);

            joints.head = new THREE.Group();
            joints.head.position.set(0, 0.104, 0);
            joints.neck.add(joints.head);

            // 1. Unified 3D Sculpted Human Head with 1024x1024 Realistic Face Texture
            const headGeo = createSculptedHumanHeadGeometry();
            const craniumMesh = new THREE.Mesh(headGeo, materials.humanFace);
            craniumMesh.castShadow = true;
            craniumMesh.receiveShadow = true;
            joints.head.add(craniumMesh);

            joints.faceFeaturesGroup = new THREE.Group();
            joints.head.add(joints.faceFeaturesGroup);

            // Smoothly contoured 3D Human Ears on sides of head
            [-1, 1].forEach(side => {
                const earGeo = new THREE.SphereGeometry(0.022, 12, 10);
                earGeo.scale(0.38, 1.05, 0.65);
                const ear = new THREE.Mesh(earGeo, materials.humanSkin);
                ear.position.set(side * 0.094, 0.106, -0.004);
                ear.rotation.y = -side * 0.22;
                ear.rotation.z = -side * 0.08;
                joints.faceFeaturesGroup.add(ear);
            });

            // 2. Natural Layered 3D Warrior Hairstyle (Swept-back volume + sideburns + nape hair, NOT spiky sea-urchin cones!)
            joints.hairGroup = new THREE.Group();
            joints.head.add(joints.hairGroup);

            // Base thick hair cap covering scalp, back of head, and sideburns
            const scalpGeo = new THREE.SphereGeometry(0.104, 32, 24);
            const sPos = scalpGeo.attributes.position;
            for (let i = 0; i < sPos.count; i++) {
                let x = sPos.getX(i), y = sPos.getY(i), z = sPos.getZ(i);
                y *= 1.24;
                x *= 0.94;
                z *= 1.08;

                // Carve out the front face opening cleanly so forehead, eyes, and cheeks are 100% unobstructed
                if (z > 0.015 && y < 0.068) {
                    z = 0.015;
                }
                // Taper nape of neck at back
                if (y < -0.04 && z < 0) {
                    x *= 0.85;
                }
                sPos.setXYZ(i, x, y + 0.118, z - 0.014);
            }
            scalpGeo.computeVertexNormals();
            const scalpCap = new THREE.Mesh(scalpGeo, materials.hair);
            scalpCap.castShadow = true;
            joints.hairGroup.add(scalpCap);

            // Layered swept-back warrior hair locks lying naturally along the crown & temples
            for (let i = 0; i < 24; i++) {
                const t = i / 23;
                const angle = (t - 0.5) * Math.PI * 1.25; // Fan across top & sides, never blocking the face
                const row = i % 3;

        function createSymmetricalPauldronGeometry(width, height, depth, side) {
            // Computes vertices symmetrically for Left (+1) and Right (-1) WITHOUT negative scaling so normals are NEVER inverted!
            const geo = new THREE.BoxGeometry(width, height, depth, 10, 3, 8);
            const pos = geo.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                let x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
                const outwardN = (x * side) / (width * 0.5); // +1 on outer edge of shoulder, -1 near neck
                const nz = z / (depth * 0.5);

                y -= nz * nz * 0.068;

                if (outwardN > 0) {
                    z *= (1.0 - outwardN * 0.42);
                    y += Math.pow(outwardN, 1.65) * 0.068; // Dragon-wing upward flare on outer edge
                } else {
                    y -= Math.pow(-outwardN, 1.4) * 0.022;
                }
                pos.setXYZ(i, x, y, z);
            }
            geo.computeVertexNormals();
            return geo;
        }

        function createLimbSegmentGeometry(topR, botR, length, bulge = 0.16) {
            const geo = new THREE.CylinderGeometry(topR, botR, length, 18, 10);
            const pos = geo.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                let x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
                const normY = (y + length * 0.5) / length;
                const muscleCurve = Math.sin(normY * Math.PI) * bulge;
                const scale = 1.0 + muscleCurve;
                pos.setXYZ(i, x * scale, y, z * (scale * 1.06));
            }
            geo.computeVertexNormals();
            return geo;
        }

        function createArticulatedHand(wristGroup, label, side) {
            // Creates a true 5-finger, 3-phalange articulated human hand with gauntlet dorsal armor and visible skin fingers!
            const handRoot = new THREE.Group();
            wristGroup.add(handRoot);
            joints['hand' + label] = handRoot;

            // 1. Sculpted Human Palm (Metacarpals)
            const palmSkin = new THREE.Mesh(new THREE.BoxGeometry(0.036, 0.082, 0.082), materials.humanSkin);
            palmSkin.position.set(0, -0.044, 0.004);
            palmSkin.castShadow = true;
            handRoot.add(palmSkin);

            // 2. Ornate Steel & Gold Gauntlet Back-of-Hand Plate (Outer dorsal side: side * 0.016)
            const dorsalPlate = new THREE.Mesh(new THREE.BoxGeometry(0.016, 0.076, 0.086), materials.armorSteel);
            dorsalPlate.position.set(side * 0.016, -0.042, 0.004);

            const knuckleGuard = new THREE.Mesh(new THREE.BoxGeometry(0.022, 0.016, 0.090), materials.goldTrim);
            knuckleGuard.position.set(side * 0.016, -0.080, 0.004);
            handRoot.add(knuckleGuard);

            // 3. Four Articulated Fingers (Index, Middle, Ring, Pinky) — each with 3 phalanges & knuckle joints!
            const fingerSpecs = [
                { name: 'index',  zOff:  0.033, lenScale: 0.96, rScale: 0.96 },
                { name: 'middle', zOff:  0.011, lenScale: 1.05, rScale: 1.00 },
                { name: 'ring',   zOff: -0.011, lenScale: 0.98, rScale: 0.95 },
                { name: 'pinky',  zOff: -0.032, lenScale: 0.82, rScale: 0.86 }
            ];

            fingerJoints[label] = [];

            fingerSpecs.forEach((spec) => {
                // MCP Joint (Knuckle)
                const mcp = new THREE.Group();
                mcp.position.set(0, -0.084, spec.zOff);
                handRoot.add(mcp);

                const knuckleKnob = new THREE.Mesh(new THREE.SphereGeometry(0.0095 * spec.rScale, 8, 8), materials.goldTrim);
                knuckleKnob.position.x = side * 0.006;
                mcp.add(knuckleKnob);

                const p1Len = 0.032 * spec.lenScale;
                const p1Mesh = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.0085 * spec.rScale, 0.0078 * spec.rScale, p1Len, 10),
                    materials.humanSkin
                );
                p1Mesh.position.y = -p1Len * 0.5;
                p1Mesh.castShadow = true;
                mcp.add(p1Mesh);

                // Dorsal finger armor scale on proximal phalanx
                const p1Plate = new THREE.Mesh(
                    new THREE.BoxGeometry(0.006, p1Len * 0.82, 0.014 * spec.rScale),
                    materials.armorSteel
                );
                p1Plate.position.set(side * 0.007, -p1Len * 0.5, 0);
                mcp.add(p1Plate);

                // PIP Joint (Middle Knuckle)
                const pip = new THREE.Group();
                pip.position.set(0, -p1Len, 0);
                mcp.add(pip);

                const pipKnob = new THREE.Mesh(new THREE.SphereGeometry(0.0078 * spec.rScale, 8, 8), materials.humanSkin);
                pip.add(pipKnob);

                const p2Len = 0.024 * spec.lenScale;
                const p2Mesh = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.0076 * spec.rScale, 0.0068 * spec.rScale, p2Len, 10),
                    materials.humanSkin
                );
                p2Mesh.position.y = -p2Len * 0.5;
                pip.add(p2Mesh);

                // DIP Joint (Distal Fingertip)
                const dip = new THREE.Group();
                dip.position.set(0, -p2Len, 0);
                pip.add(dip);

                const p3Len = 0.019 * spec.lenScale;
                const p3Mesh = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.0068 * spec.rScale, 0.0052 * spec.rScale, p3Len, 10),
                    materials.humanSkin
                );
                p3Mesh.position.y = -p3Len * 0.5;
                dip.add(p3Mesh);

                const fingerTipCap = new THREE.Mesh(new THREE.SphereGeometry(0.0054 * spec.rScale, 8, 8), materials.humanSkin);
                fingerTipCap.position.y = -p3Len;
                dip.add(fingerTipCap);

                fingerJoints[label].push({ mcp, pip, dip, isThumb: false });
            });

            // 4. Articulated Opposable Human Thumb (3 segments: CMC/MCP + Proximal + Distal)
            const thumbMcp = new THREE.Group();
            thumbMcp.position.set(-side * 0.010, -0.042, 0.042);
            thumbMcp.rotation.x = 0.45;
            thumbMcp.rotation.z = -side * 0.45;
            handRoot.add(thumbMcp);

            const t1Len = 0.030;
            const t1Mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.010, 0.009, t1Len, 10), materials.humanSkin);
            t1Mesh.position.y = -t1Len * 0.5;
            thumbMcp.add(t1Mesh);

            const thumbIp = new THREE.Group();
            thumbIp.position.set(0, -t1Len, 0);
            thumbMcp.add(thumbIp);

            const t2Len = 0.025;
            const t2Mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.0088, 0.0070, t2Len, 10), materials.humanSkin);
            t2Mesh.position.y = -t2Len * 0.5;
            thumbIp.add(t2Mesh);

            const thumbTip = new THREE.Mesh(new THREE.SphereGeometry(0.007, 8, 8), materials.humanSkin);
            thumbTip.position.y = -t2Len;
            thumbIp.add(thumbTip);

            fingerJoints[label].push({ mcp: thumbMcp, pip: thumbIp, dip: null, isThumb: true, side });

        function setHandFingerCurl(label, side, curlAmount) {
            // Curls the 5 articulated fingers inward toward the palm/sword grip (curlAmount: 0 = open, 1 = tight fist around handle)
            const list = fingerJoints[label];
            if (!list) return;
            for (let i = 0; i < list.length; i++) {
                const f = list[i];
                if (!f.isThumb) {
                    const spread = (i - 1.5) * 0.06 * (1 - curlAmount * 0.7);
                    f.mcp.rotation.x = spread;
                    f.mcp.rotation.z = -side * (1.35 * curlAmount);
                    f.pip.rotation.z = -side * (1.45 * curlAmount);
                    if (f.dip) f.dip.rotation.z = -side * (1.15 * curlAmount);
                } else {
                    f.mcp.rotation.x = 0.48 + curlAmount * 0.28;
                    f.mcp.rotation.z = -side * (0.35 + curlAmount * 0.75);
                    f.pip.rotation.z = -side * (0.25 + curlAmount * 0.95);
                }
            }
        }

        function createArticulatedCape(parentChest) {
            capeSegments = [];
            joints.capeRoot = new THREE.Group();
            joints.capeRoot.position.set(0, 0.60, -0.150);
            parentChest.add(joints.capeRoot);

            const mantleBar = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.034, 0.040), materials.goldTrim);
            mantleBar.position.set(0, 0.01, 0.01);
            joints.capeRoot.add(mantleBar);

            [-1, 1].forEach(side => {
                const clasp = new THREE.Mesh(new THREE.OctahedronGeometry(0.044, 1), materials.goldTrim);
                clasp.position.set(side * 0.185, 0.015, 0.02);
                joints.capeRoot.add(clasp);
            });

            let currentParent = joints.capeRoot;
            const segCount = 5;
            const segHeight = 0.24;

            for (let i = 0; i < segCount; i++) {
                const pivot = new THREE.Group();
                pivot.position.set(0, i === 0 ? 0 : -segHeight, 0);
                currentParent.add(pivot);

                const topW = 0.42 + i * 0.036;
                const botW = 0.42 + (i + 1) * 0.036;
                const segGeo = new THREE.PlaneGeometry(1, segHeight + 0.01, 10, 2);
                const pos = segGeo.attributes.position;
                const uv = segGeo.attributes.uv;

                for (let v = 0; v < pos.count; v++) {
                    const vy = pos.getY(v);
                    const localT = 0.5 - (vy / segHeight);
                    const globalT = (i + localT) / segCount;
                    const w = THREE.MathUtils.lerp(topW, botW, localT);
                    const vx = pos.getX(v) * w;
                    const pleatWave = Math.sin((pos.getX(v) * 5) * Math.PI) * 0.012 * (globalT + 0.2);
                    pos.setXYZ(v, vx, vy - segHeight * 0.5, pleatWave);
                    uv.setXY(v, pos.getX(v) + 0.5, 1.0 - globalT);
                }
                segGeo.computeVertexNormals();

                const segMesh = new THREE.Mesh(segGeo, materials.cape);
                segMesh.castShadow = true;
                pivot.add(segMesh);

                capeSegments.push(pivot);
                currentParent = pivot;
            }
        }

        function createCrispDiamondBladeGeometry(type, length) {
            const segs = 28;
            const positions = [];
            const indices = [];

            for (let i = 0; i <= segs; i++) {
                const t = i / segs;
                const y = 0.14 + t * length;

                let tipTaper = t < 0.80 ? 1.0 : Math.pow(1.0 - (t - 0.80) / 0.20, 0.78);
                let leftX = -0.042 * tipTaper;
                let rightX = 0.042 * tipTaper;

                if (type === 'longsword') {
                    // Lv.1 Uzun Kılıç +0 (Classic straight iron double-edged blade)
                    const straightTaper = 1.0 - t * 0.22;
                    leftX = -0.038 * straightTaper * tipTaper;
                    rightX = 0.038 * straightTaper * tipTaper;
                } else if (type === 'broadsword') {
                    // Lv.20 Geniş Kılıç +6 (Wider martial broadsword)
                    const belly = Math.sin(t * Math.PI * 0.85) * 0.014;
                    leftX = -(0.048 + belly) * tipTaper;
                    rightX = (0.048 + belly) * tipTaper;
                } else if (type === 'greatsword') {
                    // Lv.30 Dolunay Kılıcı +9 (Iconic Full Moon Sword with crescent notch & fuller)
                    const baseFlare = (t < 0.15) ? Math.sin((t / 0.15) * Math.PI) * 0.025 : 0;
                    const belly = Math.sin(t * Math.PI * 0.85) * 0.020;
                    leftX = -(0.054 + baseFlare + belly) * tipTaper;
                    rightX = (0.054 + baseFlare + belly) * tipTaper;
                } else if (type === 'poison') {
                    // Lv.75 Zehir Kılıcı +9 (Aggressive serrated ricasso spikes)
                    const serration = (t > 0.12 && t < 0.65) ? Math.max(0, Math.sin(t * 36)) * 0.028 : 0;
                    leftX = -(0.054 + serration) * tipTaper;
                    rightX = (0.054 + serration) * tipTaper;
                } else if (type === 'triton') {
                    const wing = (t > 0.18 && t < 0.36) ? Math.sin(((t - 0.18) / 0.18) * Math.PI) * 0.044 : 0;
                    leftX = -(0.052 + wing) * tipTaper;
                    rightX = (0.052 + wing) * tipTaper;
                }

                const centerX = (leftX + rightX) * 0.5;
                const thickZ = 0.015 * tipTaper;

                positions.push(
                    leftX, y, 0,
                    centerX, y, thickZ,
                    rightX, y, 0,
                    centerX, y, -thickZ
                );
            }

            for (let i = 0; i < segs; i++) {
                const row = i * 4;
                const next = (i + 1) * 4;
                for (let k = 0; k < 4; k++) {
                    const kNext = (k + 1) % 4;
                    indices.push(row + k, next + k, row + kNext);
                    indices.push(row + kNext, next + k, next + kNext);
                }
            }

            const indexedGeo = new THREE.BufferGeometry();
            indexedGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            indexedGeo.setIndex(indices);
            const crispGeo = indexedGeo.toNonIndexed();
            crispGeo.computeVertexNormals();
            return crispGeo;
        }

        function buildSwordGeometry(type) {

        function createSlashTrailSystem() {
            const maxSubdivisions = 44;
            slashTrailGeometry = new THREE.BufferGeometry();
            const positions = new Float32Array(maxSubdivisions * 2 * 3);
            const colors = new Float32Array(maxSubdivisions * 2 * 3);
            const indices = [];

            for (let i = 0; i < maxSubdivisions - 1; i++) {
                const a = i * 2, b = i * 2 + 1, c = (i + 1) * 2, d = (i + 1) * 2 + 1;
                indices.push(a, b, c, b, d, c);
            }

            slashTrailGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            slashTrailGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            slashTrailGeometry.setIndex(indices);

            const trailMat = new THREE.MeshBasicMaterial({
                vertexColors: true,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.90,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            slashTrailMesh = new THREE.Mesh(slashTrailGeometry, trailMat);
            slashTrailMesh.frustumCulled = false;
            scene.add(slashTrailMesh);
        }

        function updateSlashTrail(isSwinging) {
            if (isSamplingAnimations) return;
            const tipWorld = new THREE.Vector3();
            const baseWorld = new THREE.Vector3();
            swordTipMarker.getWorldPosition(tipWorld);
            swordBaseMarker.getWorldPosition(baseWorld);

            if (isSwinging) {
                if (slashTrailHistory.length > 0) {
                    const prev = slashTrailHistory[0];
                    const midTip = prev.tip.clone().lerp(tipWorld, 0.5);
                    const midBase = prev.base.clone().lerp(baseWorld, 0.5);
                    slashTrailHistory.unshift({ tip: midTip, base: midBase });
                }
                slashTrailHistory.unshift({ tip: tipWorld.clone(), base: baseWorld.clone() });
            } else if (slashTrailHistory.length > 0) {
                slashTrailHistory.pop();
                slashTrailHistory.pop();
                slashTrailHistory.pop();
            }

            while (slashTrailHistory.length > 26) {
                slashTrailHistory.pop();
            }

            if (slashTrailHistory.length < 3) {
                slashTrailMesh.visible = false;
                return;
            }

            slashTrailMesh.visible = true;
            const tipCurve = new THREE.CatmullRomCurve3(slashTrailHistory.map(h => h.tip));
            const baseCurve = new THREE.CatmullRomCurve3(slashTrailHistory.map(h => h.base));

            const maxSubdivisions = 44;
            const posAttr = slashTrailGeometry.attributes.position;
            const colAttr = slashTrailGeometry.attributes.color;

            const isSkillSwing = !state.actionState.startsWith('slash');
            const outerColor = new THREE.Color(state.auraActive || isSkillSwing ? getActiveAuraHex() : 0x94a3b8);
            const hotEdgeColor = new THREE.Color(0xffffff);

            for (let i = 0; i < maxSubdivisions; i++) {
                const t = i / (maxSubdivisions - 1);
                const tPt = tipCurve.getPoint(t);
                const bPt = baseCurve.getPoint(t);
                const fade = Math.pow(1 - t, 1.25);

                posAttr.setXYZ(i * 2, tPt.x, tPt.y, tPt.z);
                posAttr.setXYZ(i * 2 + 1, bPt.x, bPt.y, bPt.z);

                const edgeHotness = Math.max(0, 1 - t * 2.1);
                const rTip = THREE.MathUtils.lerp(outerColor.r, hotEdgeColor.r, edgeHotness) * fade;
                const gTip = THREE.MathUtils.lerp(outerColor.g, hotEdgeColor.g, edgeHotness) * fade;
                const bTip = THREE.MathUtils.lerp(outerColor.b, hotEdgeColor.b, edgeHotness) * fade;

                colAttr.setXYZ(i * 2, rTip, gTip, bTip);
                colAttr.setXYZ(i * 2 + 1, outerColor.r * fade * 0.30, outerColor.g * fade * 0.30, outerColor.b * fade * 0.30);
            }

            posAttr.needsUpdate = true;
            colAttr.needsUpdate = true;
        }

        function createPlusNineSparkles(sparkTexture) {

                positions[i * 3] = Math.cos(angle) * radius;

                positions[i * 3 + 2] = Math.sin(angle) * radius;
                phases[i] = Math.random() * Math.PI * 2;
            }

            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geo.setAttribute('phase', new THREE.BufferAttribute(phases, 1));

            const mat = new THREE.PointsMaterial({
                color: 0xffdf73,
                size: 0.19,
                map: sparkTexture,
                transparent: true,
                opacity: 0.85,
                blending: THREE.AdditiveBlending,
                depthWrite: false

        function emitSparks(origin, count = 28, colorHex = 0xffaa00, speedScale = 1.0) {
            if (isSamplingAnimations || !sparkParticles) return;
            const colAttr = sparkParticles.geometry.attributes.color;
            const c = new THREE.Color(colorHex);
            let spawned = 0;

            for (let i = 0; i < sparkData.length && spawned < count; i++) {
                const s = sparkData[i];
                if (s.life <= 0) {
                    s.pos.copy(origin);
                    const angle = Math.random() * Math.PI * 2;
                    const spd = (1.8 + Math.random() * 4.5) * speedScale;
                    s.vel.set(
                        Math.cos(angle) * spd,
                        (2.2 + Math.random() * 4.2) * speedScale,
                        Math.sin(angle) * spd
                    );
                    s.maxLife = 0.35 + Math.random() * 0.35;
                    s.life = s.maxLife;
                    colAttr.setXYZ(i, c.r, c.g, c.b);
                    spawned++;
                }
            }
            colAttr.needsUpdate = true;
        }

        function applyEquipmentPreset(preset) {
            const swordSel = document.getElementById('sword-select');
            const armorSel = document.getElementById('armor-select');
            const helmetSel = document.getElementById('helmet-select');
            const capeChk = document.getElementById('cape-toggle');
            const lvlBadge = document.getElementById('char-level-badge');

            if (preset === 'lv1') {
                state.auraActive = false;
                swordSel.value = 'longsword';
                armorSel.value = 'monk';
                helmetSel.value = 'none';
                capeChk.checked = false;
                if (lvlBadge) lvlBadge.innerText = 'Lv.1';
            } else if (preset === 'lv30') {
                state.auraActive = false;
                swordSel.value = 'greatsword';
                armorSel.value = 'tiger';
                helmetSel.value = 'band';
                capeChk.checked = false;
                if (lvlBadge) lvlBadge.innerText = 'Lv.30';
            } else if (preset === 'lv70') {
                state.auraActive = true;
                swordSel.value = 'poison';
                armorSel.value = 'blacksteel';
                helmetSel.value = 'crown';
                capeChk.checked = true;
                if (lvlBadge) lvlBadge.innerText = 'Lv.70';
            } else if (preset === 'lv105') {
                state.auraActive = true;
                swordSel.value = 'triton';
                armorSel.value = 'bluesteel';
                helmetSel.value = 'crown';
                capeChk.checked = true;
                if (lvlBadge) lvlBadge.innerText = 'Lv.105';
            }

            const auraBadge = document.getElementById('aura-badge');
            if (auraBadge) {
                if (state.auraActive) auraBadge.classList.remove('hidden');
                else auraBadge.classList.add('hidden');
            }

            changeArmorTheme(armorSel.value);
            changeSwordType(swordSel.value);
            changeHelmetMode(helmetSel.value);
            toggleCape(capeChk.checked);
        }

            };

        function dampValue(current, target, lambda, dt) {
            return THREE.MathUtils.lerp(current, target, 1 - Math.exp(-lambda * dt));
        }

        function dampAngle(current, target, lambda, dt) {
            let diff = target - current;
            if (Math.abs(target) < Math.PI * 1.4 && Math.abs(current) < Math.PI * 1.4) {
                diff = Math.atan2(Math.sin(diff), Math.cos(diff));
            }
            return current + diff * (1 - Math.exp(-lambda * dt));
        }

        function evalPiecewiseCurve(p, keyframes) {
            // Smoothly interpolates scalar value across an array of [time, value] keyframes using cubic smoothstep
            if (p <= keyframes[0][0]) return keyframes[0][1];
            for (let i = 0; i < keyframes.length - 1; i++) {
                const t0 = keyframes[i][0], v0 = keyframes[i][1];
                const t1 = keyframes[i + 1][0], v1 = keyframes[i + 1][1];
                if (p <= t1) {
                    const u = THREE.MathUtils.clamp((p - t0) / (t1 - t0), 0, 1);
                    const s = u * u * (3 - 2 * u);
                    return THREE.MathUtils.lerp(v0, v1, s);
                }
            }
            return keyframes[keyframes.length - 1][1];
        }

        function updateWarriorAnimation(rawDt, elapsedTime) {
            let dt = rawDt;

            // Physical Hit-Stop (Briefly slows skeletal progression right as the blade bites into the target for extreme impact weight!)
            let animDt = dt;
            if (state.hitStopTimer > 0) {
                state.hitStopTimer -= rawDt;
                animDt = rawDt * 0.12;
                state.hitVibration *= 0.88;
            } else {
                state.hitVibration = 0;
            }

            const target = createDefaultPoseTargets();

            let keyX = (state.moveKeys.d ? 1 : 0) - (state.moveKeys.a ? 1 : 0);
            let keyZ = (state.moveKeys.s ? 1 : 0) - (state.moveKeys.w ? 1 : 0);
            const inputVec = new THREE.Vector2(keyX + state.joyVec.x, keyZ + state.joyVec.y);
            const inputMag = Math.min(1.0, inputVec.length());

            const canLocomote = state.actionState === 'idle';
            const desiredSpeed = canLocomote ? inputMag : 0;
            state.currentSpeed = dampValue(state.currentSpeed, desiredSpeed, 10.5, dt);

            if (state.currentSpeed > 0.02 && canLocomote) {
                const moveDir = new THREE.Vector3(inputVec.x, 0, inputVec.y).normalize();
                moveDir.applyAxisAngle(new THREE.Vector3(0, 1, 0), camState.theta);

                const moveSpeed = 4.7 * state.currentSpeed * state.animSpeed;
                warriorGroup.position.addScaledVector(moveDir, dt * moveSpeed);
                warriorGroup.position.x = THREE.MathUtils.clamp(warriorGroup.position.x, -26, 26);
                warriorGroup.position.z = THREE.MathUtils.clamp(warriorGroup.position.z, -26, 26);

                const targetYaw = Math.atan2(moveDir.x, moveDir.z);
                let diff = targetYaw - warriorGroup.rotation.y;
                diff = Math.atan2(Math.sin(diff), Math.cos(diff));
                warriorGroup.rotation.y += diff * Math.min(1, dt * 11.5);
            }

            let isBladeSwinging = false;
            let poseResponsiveness = 18.0;
            const auraColor = getActiveAuraHex();

            if (state.actionState === 'idle') {
                if (state.isHoldingAttack) {
                    triggerComboSlash();
                } else {
                    const breath = Math.sin(elapsedTime * 2.4);
                    const breathSlow = Math.cos(elapsedTime * 1.2);
                    const s = state.currentSpeed;
                    state.walkCyclePhase += dt * (4.8 + s * 5.6) * state.animSpeed;
                    const c = state.walkCyclePhase;

                    const sinL = Math.sin(c);
                    const cosL = Math.cos(c);
                    const sinR = Math.sin(c + Math.PI);
                    const cosR = Math.cos(c + Math.PI);

                    // Trigger realistic footstep dust & subtle thud sound when boots strike ground while running
                    if (s > 0.35) {
                        const stepIdx = Math.floor(c / Math.PI);
                        if (stepIdx !== state.lastFootstepPhase) {
                            state.lastFootstepPhase = stepIdx;
                            const ankleJoint = (stepIdx % 2 === 0) ? joints.ankleL : joints.ankleR;
                            if (ankleJoint) {
                                const footPos = new THREE.Vector3();
                                ankleJoint.getWorldPosition(footPos);
                                spawnFootstepDust(footPos, 0.75 * s);
                            }
                        }
                    }

                    const idleHipsY = 1.03 + breath * 0.014;
                    const walkHipsY = 1.00 + Math.abs(Math.cos(c)) * 0.062 * s;
                    target.hipsY = THREE.MathUtils.lerp(idleHipsY, walkHipsY, s);
                    target.hipsX = THREE.MathUtils.lerp(breathSlow * 0.012, sinL * 0.038 * s, s);
                    target.hipsRotY = THREE.MathUtils.lerp(-0.22 + breathSlow * 0.02, -sinL * 0.18 * s, s);
                    target.hipsRotZ = THREE.MathUtils.lerp(0, sinL * 0.052 * s, s);
                    target.hipsRotX = THREE.MathUtils.lerp(0.03, 0.08 * s, s);

                    target.spineRotY = THREE.MathUtils.lerp(0.08, sinL * 0.12 * s, s);
                    target.chestRotY = THREE.MathUtils.lerp(0.14 - breathSlow * 0.02, sinL * 0.16 * s, s);
                    target.chestRotX = THREE.MathUtils.lerp(0.06 + breath * 0.018, 0.18 * s, s);

                    target.neckRotY = -target.hipsRotY * 0.35 - target.chestRotY * 0.35;
                    target.headRotY = -target.hipsRotY * 0.55 - target.spineRotY - target.chestRotY * 0.55;
                    target.headRotX = THREE.MathUtils.lerp(0.02 - breath * 0.012, -0.08 * s, s);

                    const strideAmp = 0.68 * s;
                    target.thL_X = THREE.MathUtils.lerp(-0.16, -sinL * strideAmp, s);
                    target.knL_X = THREE.MathUtils.lerp(0.28, Math.max(0.08, cosL * 0.84 * s + 0.34 * s), s);
                    target.anL_X = THREE.MathUtils.lerp(-0.12, -cosL * 0.25 * s, s);
                    target.toeL_X = Math.max(0, sinL) * 0.35 * s;

                    target.thR_X = THREE.MathUtils.lerp(0.16, -sinR * strideAmp, s);
                    target.knR_X = THREE.MathUtils.lerp(0.24, Math.max(0.08, cosR * 0.84 * s + 0.34 * s), s);
                    target.anR_X = THREE.MathUtils.lerp(-0.10, -cosR * 0.25 * s, s);
                    target.toeR_X = Math.max(0, sinR) * 0.35 * s;

                    target.shL_X = THREE.MathUtils.lerp(-0.26 - breath * 0.022, -sinR * 0.56 * s - 0.16, s);
                    target.shL_Y = THREE.MathUtils.lerp(0.24, 0.16, s);
                    target.shL_Z = 0.34;
                    target.elL_X = THREE.MathUtils.lerp(-0.58, -0.74, s);
                    target.leftHandCurl = 0.30 + Math.sin(elapsedTime * 1.8) * 0.08 + s * 0.38;

                    target.shR_X = THREE.MathUtils.lerp(-0.28 + breath * 0.025, -sinL * 0.28 * s - 0.22, s);
                    target.shR_Y = THREE.MathUtils.lerp(-0.44, -0.34, s);
                    target.shR_Z = -0.40;
                    target.elR_X = THREE.MathUtils.lerp(-0.52 + breath * 0.02, -0.44, s);
                    target.wrR_X = -0.16;
                    target.weaponPitch = Math.PI * 0.50 + breath * 0.015;
                }
            } else {

                const spinFlare = isBladeSwinging ? 0.14 : 0;
                joints.tassetsL.rotation.z = dampAngle(joints.tassetsL.rotation.z, 0.24 + Math.max(0, -target.thL_X) * 0.28 + spinFlare, 14, dt);
                joints.tassetsR.rotation.z = dampAngle(joints.tassetsR.rotation.z, -0.24 - Math.max(0, -target.thR_X) * 0.28 - spinFlare, 14, dt);
            }

            // Animate the 5 articulated fingers on both hands
            setHandFingerCurl('L', 1, target.leftHandCurl);
            setHandFingerCurl('R', -1, target.rightHandCurl);

            const movementEnergy = isBladeSwinging ? 0.52 : (0.14 + state.currentSpeed * 0.36);
            capeSegments.forEach((seg, idx) => {
                const wave = Math.sin(elapsedTime * (4.8 + state.currentSpeed * 4.5) - idx * 0.65) * (0.045 + idx * 0.016);
                seg.rotation.x = dampAngle(seg.rotation.x, (idx === 0 ? movementEnergy : 0.05) + wave, 13.0, dt);
                seg.rotation.z = Math.cos(elapsedTime * 3.2 + idx * 0.5) * 0.032;
            });

            if (!isSamplingAnimations) {
                updateVFXSystems(dt, elapsedTime);
                updateSlashTrail(isBladeSwinging);
            }
        }

        function updateVFXSystems(dt, elapsedTime) {
            if (weaponFlameSprites.length > 0) {
                weaponFlameSprites.forEach((item) => {
                    item.sprite.visible = state.auraActive;
                    if (state.auraActive) {
                        const waveX = Math.sin(elapsedTime * 14 + item.phase) * 0.028;
                        const waveZ = Math.cos(elapsedTime * 12 + item.phase) * 0.028;
                        const riseY = ((elapsedTime * 1.6 + item.phase * 0.2) % 0.14);
                        item.sprite.position.set(item.baseX + waveX, item.baseY + riseY, waveZ);
                        const s = item.baseScale * (0.88 + Math.sin(elapsedTime * 18 + item.phase) * 0.18);
                        item.sprite.scale.set(s, s * 1.35, 1);
                        item.sprite.material.opacity = 0.38 + Math.cos(elapsedTime * 15 + item.phase) * 0.14;
                    }
                });
            }

            if (plusNineParticles) {
                const posAttr = plusNineParticles.geometry.attributes.position;
                const phaseAttr = plusNineParticles.geometry.attributes.phase;
                for (let i = 0; i < posAttr.count; i++) {
                    let y = posAttr.getY(i) + dt * 0.58;
                    if (y > 2.10) y = 0.35;
                    posAttr.setY(i, y);
                    const angle = elapsedTime * 1.6 + phaseAttr.getX(i);
                    posAttr.setX(i, Math.cos(angle) * 0.46);
                    posAttr.setZ(i, Math.sin(angle) * 0.46);
                }
                posAttr.needsUpdate = true;
            }

            if (state.runeTimer > 0) {
                state.runeTimer -= dt;
                runeCircleMesh.position.set(warriorGroup.position.x, 0.02, warriorGroup.position.z);
                runeCircleMesh.rotation.z += dt * 2.2;
                const s = THREE.MathUtils.lerp(runeCircleMesh.scale.x, 1.0, dt * 7);
                runeCircleMesh.scale.set(s, s, 1);
                runeCircleMesh.material.opacity = Math.min(0.85, state.runeTimer * 1.1);

                if (auraPillarsGroup) {
                    auraPillarsGroup.position.copy(warriorGroup.position);
                    auraPillarsGroup.rotation.y += dt * 4.0;
                    auraPillarsGroup.scale.set(1, 0.5 + (1.48 - state.runeTimer) * 0.8, 1);
                }
                if (state.runeTimer <= 0) {
                    runeCircleMesh.visible = false;
                    if (auraPillarsGroup) auraPillarsGroup.visible = false;
                }
            }

            if (state.vortexTimer > 0) {
                state.vortexTimer -= dt;
                vortexGroup.position.copy(warriorGroup.position);
                vortexGroup.rotation.y -= dt * 12;
                if (state.vortexTimer <= 0) vortexGroup.visible = false;
            }

            for (let i = activeLightPillars.length - 1; i >= 0; i--) {
                const lp = activeLightPillars[i];
                lp.age += dt;
                const p = lp.age / lp.maxAge;
                if (p >= 1) {
                    scene.remove(lp.group);
                    activeLightPillars.splice(i, 1);
                } else {
                    lp.group.scale.set(1 - p * 0.3, 1 + p * 0.55, 1 - p * 0.3);
                    lp.group.children.forEach(c => { c.material.opacity = (1 - p) * 0.82; });
                }
            }

            for (let i = activeImpactFlashes.length - 1; i >= 0; i--) {
                const fl = activeImpactFlashes[i];
                fl.age += dt;
                const p = fl.age / fl.maxAge;
                if (p >= 1) {
                    scene.remove(fl.group);
                    activeImpactFlashes.splice(i, 1);
                } else {
                    const sc = 0.6 + p * 1.35;
                    fl.group.scale.set(sc, sc, sc);
                    fl.group.children.forEach(c => { c.material.opacity = (1 - p); });
                }
            }

            for (let i = activeRockDebris.length - 1; i >= 0; i--) {
                const rk = activeRockDebris[i];
                rk.age += dt;
                if (rk.age >= rk.maxAge) {
                    scene.remove(rk.mesh);
                    activeRockDebris.splice(i, 1);
                } else {
                    rk.vel.y -= 13.0 * dt;
                    rk.mesh.position.addScaledVector(rk.vel, dt);
                    rk.mesh.rotation.x += rk.rotVel.x * dt;
                    rk.mesh.rotation.y += rk.rotVel.y * dt;
                    if (rk.mesh.position.y < 0.06) {
                        rk.mesh.position.y = 0.06;
                        rk.vel.y *= -0.45;
                    }
                }
            }

            for (let i = activeCrescentWaves.length - 1; i >= 0; i--) {
                const cw = activeCrescentWaves[i];
                cw.age += dt;
                const p = cw.age / cw.maxAge;
                if (p >= 1) {
                    scene.remove(cw.mesh);
                    activeCrescentWaves.splice(i, 1);
                } else {
                    cw.mesh.position.addScaledVector(cw.dir, dt * 8.8);
                    const scale = 1 + p * 1.38;
                    cw.mesh.scale.set(scale, scale, scale);
                    cw.mats.forEach(m => { m.opacity = (1 - p) * 0.90; });
                }
            }

            const sPosAttr = sparkParticles.geometry.attributes.position;
            for (let i = 0; i < sparkData.length; i++) {
                const s = sparkData[i];
                if (s.life > 0) {
                    s.life -= dt;
                    s.vel.y -= 9.8 * dt;
                    s.pos.addScaledVector(s.vel, dt);
                    if (s.pos.y < 0.03) {
                        s.pos.y = 0.03;
                        s.vel.y *= -0.45;
                        s.vel.x *= 0.75;
                        s.vel.z *= 0.75;
                    }
                    sPosAttr.setXYZ(i, s.pos.x, s.pos.y, s.pos.z);
                } else {
                    sPosAttr.setXYZ(i, 0, -100, 0);
                }
            }
            sPosAttr.needsUpdate = true;

            if (metinStoneGroup && metinStoneGroup.visible) {
                metinStoneGroup.scale.lerp(new THREE.Vector3(1, 1, 1), dt * 10);
                if (metinRockMesh) {
                    metinRockMesh.material.emissiveIntensity = THREE.MathUtils.lerp(metinRockMesh.material.emissiveIntensity, 0.85, dt * 8);
                }
            }

            for (let i = activeShockwaves.length - 1; i >= 0; i--) {
                const sw = activeShockwaves[i];
                sw.age += dt;
                const progress = sw.age / sw.duration;
                if (progress >= 1) {
                    scene.remove(sw.mesh);
                    activeShockwaves.splice(i, 1);
                } else {
                    const s = 1 + progress * sw.maxScale;
                    sw.mesh.scale.set(s, s, 1);
                    sw.mesh.material.opacity = (1 - progress) * 0.82;
                }
            }

            for (let i = activeGroundScars.length - 1; i >= 0; i--) {
                const sc = activeGroundScars[i];
                sc.age += dt;
                const p = sc.age / sc.maxAge;
                if (p >= 1) {
                    scene.remove(sc.group);
                    activeGroundScars.splice(i, 1);
                } else {
                    const fade = Math.pow(1 - p, 1.4);
                    sc.mats[0].opacity = fade * 0.88;
                    sc.mats[1].opacity = fade * 0.96;
                }
            }

            for (let i = activeDustPuffs.length - 1; i >= 0; i--) {
                const dp = activeDustPuffs[i];
                dp.age += dt;
                const p = dp.age / dp.maxAge;
                if (p >= 1) {
                    scene.remove(dp.mesh);
                    activeDustPuffs.splice(i, 1);
                } else {
                    const s = 1 + p * 2.4 * dp.scaleMultiplier;
                    dp.mesh.scale.set(s, s, 1);
                    dp.mesh.material.opacity = (1 - p) * 0.38;
                }
            }

            for (let i = activeSonicRings.length - 1; i >= 0; i--) {
                const sr = activeSonicRings[i];
                sr.age += dt;
                const p = sr.age / sr.maxAge;
                if (p >= 1) {
                    scene.remove(sr.mesh);
                    activeSonicRings.splice(i, 1);
                } else {
                    const s = 1 + p * 3.8;
                    sr.mesh.scale.set(s, s, 1);
                    sr.mat.opacity = Math.pow(1 - p, 1.3) * 0.92;
                }
            }
        }

        function setupMobileJoystick() {
            const zone = document.getElementById('joystick-zone');
            const knob = document.getElementById('joystick-knob');
            let joyPointerId = null;
            const maxRadius = 36;

            const updateJoy = (clientX, clientY) => {
                const rect = zone.getBoundingClientRect();
                const cx = rect.left + rect.width * 0.5;
                const cy = rect.top + rect.height * 0.5;
                let dx = clientX - cx;
                let dy = clientY - cy;
                const dist = Math.hypot(dx, dy);
                if (dist > maxRadius) {
                    dx = (dx / dist) * maxRadius;
                    dy = (dy / dist) * maxRadius;
                }
                knob.style.transform = `translate(${dx}px, ${dy}px)`;
                state.joyVec.set(dx / maxRadius, dy / maxRadius);
            };

            const resetJoy = () => {
                joyPointerId = null;
                knob.style.transform = 'translate(0px, 0px)';
                state.joyVec.set(0, 0);
            };

            zone.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                joyPointerId = e.pointerId;
                zone.setPointerCapture(e.pointerId);
                updateJoy(e.clientX, e.clientY);
            });

            zone.addEventListener('pointermove', (e) => {
                if (e.pointerId === joyPointerId) {
                    updateJoy(e.clientX, e.clientY);
                }
            });

            zone.addEventListener('pointerup', (e) => {
                if (e.pointerId === joyPointerId) resetJoy();
            });

            zone.addEventListener('pointercancel', (e) => {
                if (e.pointerId === joyPointerId) resetJoy();
            });
        }

        function setupInteractionEvents() {
            const dom = renderer.domElement;

            dom.addEventListener('pointerdown', (e) => {
                if (camState.touchId === null) {
                    camState.touchId = e.pointerId;
                    camState.isDragging = true;
                    camState.prevX = e.clientX;
                    camState.prevY = e.clientY;
                }
            });

            window.addEventListener('pointermove', (e) => {
                if (!camState.isDragging || e.pointerId !== camState.touchId) return;
                const dx = e.clientX - camState.prevX;
                const dy = e.clientY - camState.prevY;
                camState.prevX = e.clientX;
                camState.prevY = e.clientY;

                camState.theta -= dx * 0.007;
                camState.phi = THREE.MathUtils.clamp(camState.phi - dy * 0.006, 0.25, Math.PI * 0.47);
            });

            const endDrag = (e) => {
                if (e.pointerId === camState.touchId) {
                    camState.isDragging = false;
                    camState.touchId = null;
                }
            };
            window.addEventListener('pointerup', endDrag);
            window.addEventListener('pointercancel', endDrag);

            dom.addEventListener('wheel', (e) => {
                e.preventDefault();
                camState.targetRadius = THREE.MathUtils.clamp(camState.targetRadius + e.deltaY * 0.004, 1.6, 16);
            }, { passive: false });

            window.addEventListener('keydown', (e) => {
                const key = e.key.toLowerCase();
                if (key === ' ') {
                    state.isHoldingAttack = true;
                    triggerComboSlash(e);
                } else if (key === '1') {
                    triggerSkill('aura');
                } else if (key === '2') {
                    triggerSkill('spin');
                } else if (key === '3') {
                    triggerSkill('triple');
                } else if (key === '4') {
                    triggerSkill('dash');
                } else if (key === 'w' || e.key === 'ArrowUp') {
                    state.moveKeys.w = true;
                } else if (key === 's' || e.key === 'ArrowDown') {
                    state.moveKeys.s = true;
                } else if (key === 'a' || e.key === 'ArrowLeft') {
                    state.moveKeys.a = true;
                } else if (key === 'd' || e.key === 'ArrowRight') {
                    state.moveKeys.d = true;
                }
            });

            window.addEventListener('keyup', (e) => {
                const key = e.key.toLowerCase();
                if (key === ' ') state.isHoldingAttack = false;
                if (key === 'w' || e.key === 'ArrowUp') state.moveKeys.w = false;
                if (key === 's' || e.key === 'ArrowDown') state.moveKeys.s = false;
                if (key === 'a' || e.key === 'ArrowLeft') state.moveKeys.a = false;
                if (key === 'd' || e.key === 'ArrowRight') state.moveKeys.d = false;
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function updateCameraPosition(dt) {
            camState.radius = THREE.MathUtils.lerp(camState.radius, camState.targetRadius, 0.12);
            camState.lookAtOffset.lerp(camState.targetLookAt, 0.12);

            // Spring-damper physics for directional combat camera punch & FOV surge
            camState.punchOffset.addScaledVector(camState.punchVel, dt);
            camState.punchVel.addScaledVector(camState.punchOffset, -38.0 * dt);
            camState.punchVel.multiplyScalar(Math.exp(-12.0 * dt));

            if (Math.abs(camState.fov - camState.targetFov) > 0.05) {
                camState.fov = THREE.MathUtils.lerp(camState.fov, camState.targetFov, dt * 8.5);
                camera.fov = camState.fov;
                camera.updateProjectionMatrix();
            }

            const targetCenter = warriorGroup.position.clone().add(camState.lookAtOffset).add(camState.punchOffset);

            if (camState.shakeIntensity > 0.001) {
                targetCenter.x += (Math.random() - 0.5) * camState.shakeIntensity;
                targetCenter.y += (Math.random() - 0.5) * camState.shakeIntensity;
                camState.shakeIntensity *= 0.84;
            }

            const cx = targetCenter.x + camState.radius * Math.sin(camState.phi) * Math.sin(camState.theta);
            const cy = targetCenter.y + camState.radius * Math.cos(camState.phi);
            const cz = targetCenter.z + camState.radius * Math.sin(camState.phi) * Math.cos(camState.theta);

            camera.position.set(cx, Math.max(0.35, cy), cz);
            camera.lookAt(targetCenter);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (isSamplingAnimations) return;
            const rawDt = Math.min(clock.getDelta(), 0.1);
            const elapsedTime = clock.getElapsedTime();

            updateWarriorAnimation(rawDt, elapsedTime);
            updateUploadedCharacterAnimation(rawDt);
            updateCameraPosition(rawDt);
            renderer.render(scene, camera);
        }

        window.onload = function () {
            initScene();
            animate();
        };
    </script>
